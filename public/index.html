 {h:"How access changes",p:["Before payment is confirmed, your account remains in guest preview mode. After a real payment provider confirms a successful payment, the platform can activate subscriber access for the purchased period.","If a subscription expires or is cancelled, paid access should end according to the plan terms. Your learning progress may be saved separately, but saved progress does not itself grant access to locked lessons."]},
 {h:"Keeping your account safe",p:["Use a strong, unique password and never share sign-in codes. Check that payment pages belong to the provider you intended to use. Keep receipts and contact the platform through its published support channel if a payment or access status looks wrong.","A real course platform verifies subscription status securely before delivering paid content. A visual lock on a page is not enough by itself; the service that stores the lessons must also check access."]},
 {h:"Make the most of the course",p:["Choose a lesson, take notes and complete its practical assignment before moving on. Revisit earlier lessons when a later project needs the same skill. Use the progress tracker as a reminder of what you have completed, not as a measure of your worth.","The AI assistant can help explain ideas and suggest practice, but it can make mistakes. Check important information and use your own judgment when applying what you learn."]}
 ],
 mistakes:["Assuming a plan is active before payment is confirmed.","Sharing passwords or one-time sign-in codes.","Ignoring the renewal period or cancellation terms.","Expecting a guest preview to include every paid lesson.","Treating course completion as a guarantee of views, clients or income."],
 gloss:[["Guest preview","Free access to selected introductory content."],["Subscriber","A user with a confirmed, active paid plan."],["Billing period","The amount of time covered by a subscription payment."],["Renewal","The next billing event for a continuing plan."],["Access control","The checks that decide whether content can be opened."],["Payment confirmation","A verified notice that a payment succeeded."]],
 assign:["Write down what the guest preview includes and what a paid plan unlocks.","Compare the monthly and yearly billing periods and calculate which one fits your needs.","Create a short account-safety checklist with at least four steps."],
 quiz:[{q:"What can a guest do?",o:["Open every paid lesson","View the free preview and plans","Use all subscriber features"],a:1,why:"Guest access is limited to preview content and plan information."},{q:"What do all subscription plans include in this academy?",o:["Different lesson libraries","The same course features, with different billing periods","Management tools"],a:1,why:"The plans differ by billing period and price, not by course features."},{q:"When should paid access activate?",o:["When someone clicks a plan","After payment is confirmed","When the page is refreshed"],a:1,why:"A real payment confirmation should trigger access activation."},{q:"What should you check before subscribing?",o:["Price, billing period and cancellation terms","Only the button color","Nothing"],a:0,why:"Understand the payment terms before choosing a plan."},{q:"Does course completion guarantee income?",o:["Yes","No, outcomes depend on many factors","Only on yearly plans"],a:1,why:"Learning builds skills, but it cannot guarantee business results."}]},
{id:"m8",title:"Planning a content strategy",intro:"Build a repeatable plan instead of posting at random.",sections:[{h:"Choose a clear audience",p:["Decide who a clip is meant to help or entertain. “Everyone” is too broad. A gaming channel might focus on funny fails, skilled plays or beginner tips. Pick one main audience and write what they usually enjoy."]},{h:"Create content pillars",p:["Choose three repeatable themes, such as highlights, tutorials and behind-the-scenes moments. Pillars make it easier to plan while keeping your feed varied. Give each pillar a clear purpose and a few example ideas."]},{h:"Make a realistic schedule",p:["Choose a schedule you can maintain alongside school and other responsibilities. Batch ideas and prepare drafts, but leave room to respond to timely moments. Consistency means a dependable rhythm, not posting every hour."]}],mistakes:["Adding effects that distract from the message.", "Skipping a quality check before sharing.", "Making promises about views, sales or client outcomes.", "Using footage, music or designs without checking permission."],gloss:[["Audience", "the people a piece of content is intended for."], ["Content pillar", "a repeatable theme that organizes posts."], ["Batching", "preparing several pieces of work in one session."]],assign:["Write a one-sentence audience description.", "Choose three content pillars and list five ideas under each.", "Create a seven-day publishing plan with realistic time blocks."],quiz:[{q:"What is a content pillar?",o:["A random trend", "A repeatable theme for content", "A payment method"],a:1,why:"Pillars organize ideas around a few clear themes."},{q:"What makes a schedule useful?",o:["It is realistic and repeatable", "It requires posting constantly", "It never changes"],a:0,why:"A sustainable schedule is easier to maintain."}]},
{id:"m9",title:"Advanced editing and visual storytelling",intro:"Use rhythm, framing and transitions to make edits clearer and more engaging.",sections:[{h:"Edit for meaning first",p:["Every cut should help the viewer understand the moment. Remove pauses that add nothing, but keep a reaction or silence when it creates suspense. Do not add effects just because they are available."]},{h:"Use framing with purpose",p:["Keep the important action visible in the chosen aspect ratio. For vertical video, check that faces, game action and captions are not hidden by interface buttons. Reposition and scale carefully, and preview on a phone-sized screen."]},{h:"Build rhythm and continuity",p:["Use cuts to control pace. A fast sequence can communicate chaos; a longer shot can let a reaction land. Match action across cuts where possible, and use transitions only when they clarify a change in time, place or idea."]}],mistakes:["Adding effects that distract from the message.", "Skipping a quality check before sharing.", "Making promises about views, sales or client outcomes.", "Using footage, music or designs without checking permission."],gloss:[["Continuity", "the feeling that shots connect logically."], ["Pacing", "the speed and rhythm of an edit."], ["Safe area", "the part of the frame not covered by platform controls."]],assign:["Take one clip and make a clean version with no decorative effects.", "Make a second version that changes pace using shot length and sound.", "Compare both versions and explain which edit choices improve clarity."],quiz:[{q:"What should guide an editing effect?",o:["Whether it is trending", "Whether it supports the story", "How many effects are available"],a:1,why:"Effects should support meaning rather than distract."},{q:"Why preview vertical clips on a phone?",o:["To check framing and interface-safe areas", "To increase file size", "To remove all captions"],a:0,why:"A phone preview reveals cropping and readability issues."}]},
{id:"m10",title:"Audio, voice and sound design",intro:"Make dialogue clear and use sound thoughtfully without overwhelming the video.",sections:[{h:"Prioritize clear speech",p:["Viewers should be able to understand important dialogue. Listen with headphones, reduce distracting background noise where possible and keep voice levels consistent. Avoid extreme volume changes between clips."]},{h:"Layer sound carefully",p:["Music, effects and voice each have a role. Keep background music lower than speech, and use effects to emphasize meaningful actions. Silence can also be effective when it makes a moment feel more important."]},{h:"Check permissions and exports",p:["Use audio you created, licensed or are permitted to use on the platform where you publish. A track available in one app may not be cleared for every use. Listen to the exported file before publishing."]}],mistakes:["Adding effects that distract from the message.", "Skipping a quality check before sharing.", "Making promises about views, sales or client outcomes.", "Using footage, music or designs without checking permission."],gloss:[["Sound design", "the deliberate use of audio to support a story."], ["Audio mix", "the balance between different sound sources."], ["License", "permission with conditions for using creative work."]],assign:["Choose a permitted audio track and place it under a spoken clip.", "Balance voice and music so every important word is clear.", "Export and listen once with headphones and once through ordinary speakers."],quiz:[{q:"What should usually be easiest to hear?",o:["Important dialogue", "Background music", "Every sound at equal volume"],a:0,why:"The viewer needs to understand the speech."},{q:"Does music in one app automatically have universal permission?",o:["Yes", "No, check the applicable terms", "Only for long videos"],a:1,why:"Permissions can vary by platform and use."}]},
{id:"m11",title:"Thumbnails, titles and channel identity",intro:"Package videos clearly so viewers know what they are choosing.",sections:[{h:"Design a readable thumbnail",p:["Use one main subject, strong contrast and a short phrase if text is needed. Keep important details large enough to read on a small screen. Avoid clutter and do not promise something the video does not show."]},{h:"Write accurate titles",p:["A useful title tells viewers what happens or why it matters. Specific wording is stronger than vague hype. Do not use misleading claims, fake urgency or unrelated trending names to attract clicks."]},{h:"Create a consistent identity",p:["Choose a small set of colors, fonts and visual rules. Use them consistently without making every post look identical. Your identity should help people recognize your work while the content remains the main attraction."]}],mistakes:["Adding effects that distract from the message.", "Skipping a quality check before sharing.", "Making promises about views, sales or client outcomes.", "Using footage, music or designs without checking permission."],gloss:[["Thumbnail", "a small preview image representing a video."], ["Brand identity", "recognizable visual and verbal choices."], ["Click-through rate", "the share of impressions that become clicks."]],assign:["Create two thumbnail drafts for the same clip and compare readability at small size.", "Write five accurate title options for the clip.", "Define three visual rules for your channel identity."],quiz:[{q:"What is the main job of a thumbnail?",o:["Explain the video visually", "Replace the video", "Guarantee views"],a:0,why:"A thumbnail helps viewers understand what they may watch."},{q:"What makes a title trustworthy?",o:["It accurately describes the content", "It promises impossible results", "It copies a popular title"],a:0,why:"Accurate titles build audience trust."}]},
{id:"m12",title:"Analytics and improving performance",intro:"Read basic performance signals and use them to make careful improvements.",sections:[{h:"Understand useful metrics",p:["Views show how often a video was watched under a platform’s counting rules. Average watch time and retention help show where viewers stay or leave. Engagement can include comments, shares and saves. Each platform defines metrics differently."]},{h:"Look for patterns, not one-off results",p:["Compare several posts with similar topics and formats. A single unusually high or low result may have many causes. Note the hook, length, topic and publishing context before drawing conclusions."]},{h:"Run one small experiment",p:["Change one thing at a time, such as the opening line or caption style. Keep other choices similar and compare the results over several posts. Treat analytics as clues, not guarantees or a judgment of your worth."]}],mistakes:["Adding effects that distract from the message.", "Skipping a quality check before sharing.", "Making promises about views, sales or client outcomes.", "Using footage, music or designs without checking permission."],gloss:[["Retention", "the share of viewers who continue watching over time."], ["Impression", "an instance where a platform displays a piece of content."], ["Experiment", "a planned test used to learn what works."]],assign:["Choose three of your own posts and record the available metrics.", "Identify one pattern and one question the data cannot answer.", "Plan a small test that changes only one editing or packaging choice."],quiz:[{q:"Why compare multiple posts?",o:["To reduce conclusions from one unusual result", "To guarantee future views", "To avoid learning"],a:0,why:"Patterns across posts are more informative than one result."},{q:"What is a fair experiment?",o:["Change many things at once", "Change one main variable", "Ignore the results"],a:1,why:"Changing one variable makes the comparison easier to interpret."}]},
{"id":"m13","title":"Sports starter guide: 10 sports, rules and examples","intro":"Explore ten popular sports, understand their basic rules, and choose a sport to try safely. There is no single best sport for everyone: the right choice depends on your interests, access, abilities and available facilities.","sections":[{"h":"Ten sports to know","p":["1. **Football (soccer):** Two teams try to score by getting the ball into the opposing goal. Most players cannot use their hands or arms; the goalkeeper can use hands inside their own penalty area. Example: pass to a teammate in space rather than crowding around the ball.","2. **Basketball:** Two teams score by putting the ball through the opponent’s hoop. Players move by dribbling; running while holding the ball without dribbling is travelling. Example: pass to an open teammate instead of forcing a difficult shot.","3. **Volleyball:** Teams send the ball over a net and try to make it land in the other team’s court. A team usually has up to three touches to return it, and the same player generally cannot hit it twice in a row. Example: receive, set, then spike.","4. **Badminton:** Players use rackets to hit a shuttlecock over a net. A rally ends when the shuttle lands out, hits the net and fails to cross, or is not returned legally. Example: aim a controlled shot into open court rather than hitting as hard as possible.","5. **Table tennis:** Players use small rackets to hit a lightweight ball across a table net. The ball must bounce on your side before you return it; in singles, serves alternate every two points. Example: use a short serve to make the opponent move forward.","6. **Athletics (track and field):** Includes running, jumping and throwing events. Competitors follow the rules for their event, such as staying in assigned lanes in certain races or taking off from behind the foul line in long jump. Example: a 100-metre sprint is a race to the finish, not a contact event.","7. **Swimming:** Competitors race through water using strokes such as freestyle, backstroke, breaststroke and butterfly. Rules cover the stroke technique, starts and turns. Example: in freestyle, swimmers generally use any stroke, commonly front crawl.","8. **Tennis:** Players hit a ball over a net into the opponent’s court. Points are scored 15, 30, 40 and game; a player must win by two points unless a format uses a tiebreak. Example: serve diagonally into the opposite service box.","9. **Cricket:** Two teams take turns batting and fielding. Batters score runs by running between wickets or hitting boundaries; the fielding team tries to dismiss batters. Example: a batter can score four when the ball reaches the boundary after touching the ground.","10. **Rugby:** Teams carry, pass or kick an oval ball to score tries and other points. In rugby union, passes by hand must go sideways or backwards, not forward. Tackling is tightly regulated; learn safe technique with a qualified coach. Example: pass backwards to a teammate running into space."]},{"h":"How to choose a sport that fits you","p":["Think about what you enjoy: team play, individual challenges, speed, coordination, strategy or time outdoors. Consider the cost of equipment, access to a safe playing space, coaching, transport and whether beginners are welcome. You do not need expensive equipment to start many activities.","Try a beginner session before committing. Ask about age groups, required equipment, supervision, fees and safety procedures. Choose a welcoming environment where rules are explained and questions are encouraged. You can enjoy a sport recreationally without aiming to compete.","Do not treat a list as a ranking. Football may be easy to find in one community, while badminton, swimming or athletics may be more accessible in another. Your best choice is the one you can enjoy and practise safely."]},{"h":"Rules, fair play and examples","p":["Learn the rules of the exact version you are playing. School, recreational and professional formats can differ. Before a game, agree on boundaries, scoring, team size, time limits and how disputes will be handled.","Respect referees, coaches, teammates and opponents. Do not argue over every decision, deliberately injure someone, mock beginners or cheat. If you do not understand a call, ask politely when play has stopped.","Example: in a friendly basketball game, a player admits that the ball touched their hand before going out, even though the referee did not see it. That is fair play. In a football game, a player helps an opponent up after a harmless collision and waits for the referee’s signal before restarting."]},{"h":"Safety before and during sport","p":["Use a suitable playing area and equipment that fits. Warm up gently, learn the correct technique and follow the coach’s instructions. Drink water and take breaks when needed. Avoid playing through pain, dizziness, unusual weakness or feeling unwell; stop and tell a responsible adult or coach.","Swimming requires particular care: swim only in a supervised, permitted area with appropriate adult supervision and lifeguard support. Never swim alone or enter water to rescue someone; alert a lifeguard or emergency services.","Contact sports and activities with higher risks should be learned with qualified instruction and appropriate protective equipment. Never copy a dangerous stunt because it appears in a video."]}],"mistakes":["Treating one sport as best for everybody.","Ignoring the rules of the version being played.","Skipping warm-ups or using unsuitable equipment.","Playing through pain or feeling unwell.","Mocking opponents or beginners instead of showing respect."],"gloss":[["Fair play","Respecting rules, teammates, opponents and officials."],["Dribbling","Moving with a ball while controlling it by bouncing it, as in basketball."],["Rally","A sequence of play between the serve and the end of a point."],["Warm-up","Gentle preparation before more demanding activity."]],"assign":["Choose two sports from the list and compare their rules, equipment and playing spaces.","Write a simple beginner checklist for the sport you would like to try.","Find a supervised beginner opportunity and list the questions you would ask before joining."],"quiz":[{"q":"In basketball, what must a player generally do to move while holding the ball?","o":["Dribble the ball","Carry it while running","Kick it"],"a":0,"why":"Dribbling is the normal way to move with the ball."},{"q":"How many touches does a volleyball team usually have to return the ball?","o":["One","Up to three","Unlimited"],"a":1,"why":"A team generally has up to three hits to return the ball."},{"q":"What is the safest approach to learning a new sport?","o":["Copy advanced stunts","Join a supervised beginner session and learn the rules","Ignore protective equipment"],"a":1,"why":"Qualified guidance and suitable equipment help beginners learn safely."},{"q":"Which statement about the ten sports is most accurate?","o":["One is best for everyone","The best choice depends on the person and circumstances","Rules never vary"],"a":1,"why":"Interests, access and local formats all matter."}]},
{"id":"m14","title":"Everyday life skills: communication, teamwork and problem-solving","intro":"Build practical skills for school, sport, friendships and future projects: listening, communicating clearly, working with others and handling disagreements respectfully.","sections":[{"h":"Listen before responding","p":["Give the speaker your attention, avoid interrupting and ask a clarifying question if something is unclear. Listening does not mean you must agree; it means you understand what the other person is saying before you reply.","Example: a teammate says the group is not passing enough. Instead of arguing, ask, “Which moments do you think we missed a pass?” Then discuss a specific improvement."]},{"h":"Communicate clearly and respectfully","p":["Use simple, specific language. Explain what happened, what you need and what you suggest. Speak about actions rather than attacking someone’s character. Choose a suitable time and place for difficult conversations.","A useful pattern is: “When [specific situation] happens, it affects [impact]. Could we try [clear request]?” Example: “When the meeting starts late, we run out of time. Could we agree to begin at four?”"]},{"h":"Work as a team","p":["A team works better when people understand the shared goal, roles and expectations. Share tasks fairly, keep commitments and tell the group early if you need help. Give credit to other people’s contributions.","Example: for a school presentation, one person researches, one organizes slides, one checks facts and one presents. Everyone reviews the final work so the result feels joined-up."]},{"h":"Solve disagreements constructively","p":["Pause if emotions are high. Describe the problem without insults, listen to each side, identify what both people need and agree on a practical next step. If someone is threatening, bullying or making you feel unsafe, seek help from a trusted adult rather than trying to handle it alone.","Example: two teammates want the same role. They can discuss the skills needed, try rotating roles during practice and ask the coach to make a fair decision."]}],"mistakes":["Interrupting before understanding the issue.","Using insults or blaming language.","Taking all the tasks or refusing to help.","Keeping quiet about a problem until it becomes bigger.","Trying to resolve unsafe situations without trusted support."],"gloss":[["Active listening","Paying attention and checking that you understood."],["Compromise","An agreement where people adjust some preferences to move forward."],["Responsibility","Following through on an agreed task."],["Feedback","Information that can help improve a piece of work or an action."]],"assign":["Practise summarizing someone's point before giving your own view.","Write a respectful message asking a group to agree on roles and a deadline.","Describe a disagreement and list two fair ways to resolve it."],"quiz":[{"q":"What is a useful first step in a disagreement?","o":["Interrupt and blame","Listen and clarify the issue","Post about it publicly"],"a":1,"why":"Understanding the issue helps people find a fair next step."},{"q":"Which sentence focuses on a practical request?","o":["You are always useless","Could we agree to start at four?","Nobody likes working with you"],"a":1,"why":"A specific request is easier to discuss and act on."},{"q":"What should you do if a situation feels unsafe?","o":["Handle it alone at all costs","Seek help from a trusted adult","Escalate the argument"],"a":1,"why":"Safety comes first; get support from someone responsible."}]},
{"id":"m15","title":"Personal organization: time, money basics and digital safety","intro":"Learn simple habits for managing your time, making thoughtful spending choices and protecting yourself online. These are starter skills, not a substitute for advice from a trusted adult or qualified professional.","sections":[{"h":"Plan your time realistically","p":["Write down important commitments such as school, rest, family responsibilities and activities. Break a large task into smaller steps and choose a realistic time for each. Leave some space for unexpected changes.","Example: instead of writing “study science,” write “read pages 10–15, make five notes and answer three practice questions.” A clear task is easier to begin and finish.","A plan should support a balanced routine. Sleep, meals, breaks, movement and time with people matter too. If a plan repeatedly feels impossible, reduce the task or ask for help rather than blaming yourself."]},{"h":"Understand money choices","p":["A budget is a simple plan for money coming in and money going out. List needs, optional wants and savings goals. Before buying something, compare the total cost, quality, usefulness and whether you can afford it without borrowing.","Example: if you receive a small allowance, you might set aside part for transport or school needs, part for a planned treat and part for a savings goal. The amounts should fit your real situation; there is no one correct percentage.","Be cautious with offers promising quick money, guaranteed returns or prizes if you pay first. Do not share banking details, passwords or one-time codes. Ask a trusted adult before making unfamiliar online purchases or financial decisions."]},{"h":"Protect your accounts and information","p":["Use a different strong password for each important account and turn on two-step verification where available. Never share passwords, login codes, home address, school details or private documents with strangers. Check privacy settings and think before posting.","Watch for scams that create urgency, pretend to be a friend or ask you to click an unexpected link. Verify requests through a separate trusted channel. If a message worries you, do not respond immediately; show it to a trusted adult.","Be respectful online. Ask permission before sharing someone else's photo or private message. Block and report accounts that harass or threaten you, and seek help from a trusted adult."]},{"h":"Make decisions and review progress","p":["For a choice, define the problem, list realistic options, think about likely consequences and ask for advice when the stakes are high. Choose a small next step, then review what happened.","Example: if you have two assignments due, check deadlines and how long each may take. Start with the urgent task or the smaller step that helps you get moving, then review your plan.","Your plan can change. Reviewing it is a way to learn, not a reason to judge yourself."]}],"mistakes":["Making a schedule with no time for rest or changes.","Spending without checking the total cost.","Trusting a message because it looks urgent or familiar.","Sharing passwords or verification codes.","Believing that every online offer promising quick money is genuine."],"gloss":[["Budget","A plan for money received and money spent."],["Need","Something important for everyday life or a responsibility."],["Want","Something desirable but not essential."],["Two-step verification","An extra sign-in check beyond a password."],["Phishing","A deceptive message designed to steal information or access."]],"assign":["Create a realistic one-week plan that includes school, responsibilities, rest and an activity you enjoy.","Make a sample budget for an imaginary amount of pocket money, separating needs, wants and a savings goal.","Write five rules you will follow to protect your accounts and personal information."],"quiz":[{"q":"What makes a time plan more useful?","o":["It includes realistic tasks and breaks","It schedules every minute with no flexibility","It ignores important commitments"],"a":0,"why":"Realistic plans leave room for rest and unexpected changes."},{"q":"What should you do with an unexpected request for a login code?","o":["Send it quickly","Keep it private and verify the request","Post it in a group"],"a":1,"why":"Login codes should never be shared with another person."},{"q":"What is a budget for?","o":["Planning money coming in and going out","Guaranteeing that you become wealthy","Avoiding all spending"],"a":0,"why":"A budget helps you understand and plan spending."}]}

var TOPICS={
clip:{body:"Start with one idea: a clip is one moment with a setup and a payoff.\n1. Watch the long video once and note timestamps of spikes: a crash, a funny line, a close escape.\n2. Cut 15 to 40 seconds around one moment.\n3. Put the most surprising frame or line in the first 2 seconds.\nGTA-style example: a police chase that ends with a jump over the river. Open on the jump, then show how it started.\nUse free tools first, like CapCut's free tier. Results vary, so judge by your own watch-time numbers.",
 assign:"Mark 3 timestamps in one 10-minute gameplay video you have permission to use.",check:"In your own words, why does the hook go in the first 2 seconds?",why:"Feeds let people swipe instantly, so the first seconds decide who stays."},
capcut:{body:"Here is a simple CapCut routine.\n1. Trim silence and slow starts.\n2. Add auto captions, then fix mistakes by hand. Keep 3 to 5 words on screen.\n3. Add a zoom, cut or sound every 2 to 3 seconds.\n4. Write a hook line over the first frame.\nExample: a failed heist clip. Hook over the first frame, cut the 4-second loading wait, zoom on the explosion.",
 assign:"Edit one clip with captions and a hook line, then compare it to the raw version.",check:"What are two things you removed or added to keep people watching?",why:"Each change removes a reason to leave or adds a reason to stay."},
price:{body:"Pricing steps for a beginner.\n1. Decide what one unit is, such as one clip up to 45 seconds.\n2. Set a starting price you can live with and state what is included: clips, revisions, deadline.\n3. Ask for a deposit before you start.\n4. If a client says it is too much, offer fewer clips for their budget instead of cutting your rate.\nExample: 10 clips at one price becomes 5 clips at half the price.\nI can't promise what any client will pay. Test with real conversations.",
 assign:"Write your offer in 3 lines: what they get, the price, the deadline.",check:"What would you say if a client asks for a 50% discount?",why:"Adjusting scope keeps trust and lets both sides say yes."},
client:{body:"A message that gets replies is short and specific.\n1. Mention one real moment from their content.\n2. Attach a short sample.\n3. Ask one easy question.\nExample for WhatsApp: Hi Tolu, I watched your last stream. The moment at 41:10 would make a strong short. Here is a 20-second sample. Want me to cut 5 more?\nSend to a small list first and track who replies. Practice the conversation with a friend or by writing both sides of the exchange.",
 assign:"Write 3 messages for 3 creators. Each mentions one real moment.",check:"Which line in your message proves you actually watched their content?",why:"Specific messages feel personal, so they get read."},
copy:{body:"Copyright basics for clippers (general education, not legal advice).\n1. Prefer your own footage or footage with written permission.\n2. Read the game publisher's content policy.\n3. Read each platform's reused-content rules.\n4. Save screenshots of permissions with dates.\nExample: a streamer replies yes on WhatsApp. Screenshot it and file it.",
 assign:"Find the content policy for one game and write 3 rules in your own words.",check:"What would you show someone who questioned a clip's source?",why:"Proof of permission protects you and the creator."},
product:{body:"Make a small digital product.\n1. Choose one narrow problem you can already solve.\n2. Build the smallest useful version, like a one-page checklist PDF.\n3. Test interest by posting about it before you build more.\n4. Sell it on a free-to-start store with a plain description.\nExample: Clip Hook Checklist, 12 fields in a PDF.\nUse Canva or Google Docs for the design.",
 assign:"Write one sentence: who it helps and what changes for them.",check:"Why start with the smallest version?",why:"It gets feedback fast and costs little to fix."},
course:{body:"Outline a mini course.\n1. Write the end result: after this course the student can cut and post a 30-second GTA clip.\n2. List 5 lessons that move from zero to that result.\n3. Give each lesson one task and one question.\n4. Record or write the first lesson only, then ask 3 people to try it.\nExample modules: pick moments, cut, hook, caption, post.",
 assign:"Write your end result and 5 lesson titles.",check:"What task will the student do after lesson 1?",why:"Course outcomes keep lessons focused, and tasks prove learning."},
conf:{body:"Confidence comes from preparation and listening.\n1. Write your first sentence ahead of time.\n2. Ask one question and let them finish.\n3. Repeat their goal in your own words.\n4. Offer one clear next step.\nExample: So you want 10 clips a week from your streams, is that right?\nPractice out loud three times before a real call.",
 assign:"Say your 2-sentence intro out loud 3 times, then once to a friend.",check:"What is the benefit of repeating the other person's goal back?",why:"People feel understood, which lowers tension and builds trust."},
platform:{body:"High-level, a subscription platform has four parts.\n1. Accounts: guest and active subscriber.\n2. Plans and payments: decide who is paid up and until when.\n3. Access checks: every page asks who you are before showing content, and the server confirms it.\n4. A secure platform management layer maintains lesson access and subscription records.\nThe AI assistant is the premium feature on top.",
 assign:"Sketch your own platform: what you teach, what is free, what is locked.",check:"Where must the real access check happen?",why:"The browser can be edited by anyone, so only the server can be trusted."},
hi:{body:"Hello. What would you like to learn first: clipping, CapCut, finding clients, pricing, copyright, digital products, courses or confidence?",assign:"",check:"",why:""},
other:{body:"I can teach these one at a time: clipping, CapCut, finding clients, pricing, copyright, digital products, courses, confidence, and how this platform works.\nPick one and tell me your level. Beginner is fine.",assign:"",check:"",why:""}

function topic(t){t=t.toLowerCase();
 if(/^\s*(hi|hello|hey)\b/.test(t))return"hi";
 if(/price|pricing|negotiat|rate|charge|paid|payment|deposit/.test(t))return"price";
 if(/client|dm|whatsapp|outreach|message|email/.test(t))return"client";
 if(/capcut|caption|subtitle|edit/.test(t))return"capcut";
 if(/hook|retention|watch time|gta|clip|viral|short/.test(t))return"clip";
 if(/copyright|strike|rules|permission|dmca/.test(t))return"copy";
 if(/ebook|pdf|template|digital product|toolkit/.test(t))return"product";
 if(/course|outline|module|curriculum/.test(t))return"course";
 if(/confiden|nervous|shy|afraid|persuad|listen|communicat/.test(t))return"conf";
 if(/platform|subscription|paywall|management|build|website/.test(t))return"platform";
 return"other";
}
function compose(text,mode){
  var T=TOPICS[topic(text)];var out=T.body;
  var length=D.settings.answerLength||"standard";
  if(length==="short")out=out.split("\n").slice(0,4).join("\n");
  if((mode==="deep"||length==="detailed")&&T.why)out+="\n\n**Why it works:** "+T.why;
  if(length!=="short"&&T.assign)out+="\n\n**Assignment:** "+T.assign;
  if(length==="detailed"&&T.check)out+="\n\n**Check:** "+T.check;
  return out;
}
function roleplay(text){
  if(!S.rp){S.rp={};return"Roleplay started. I'm a client. Reply to my first message.\n\n**Client:** Hi, I saw your clips. How much for 10 clips from my GTA stream? I need them by Friday."}
  var ok=[],no=[];
  (/[?]/.test(text)?ok:no).push("You asked a question to learn what they need");
  (/[$£€₦]\s?\d|\d+\s?(usd|naira|dollars|per clip)|price|rate|cost/i.test(text)?ok:no).push("You stated a price");
  (/friday|deadline|days?|delivery|deliver|by /i.test(text)?ok:no).push("You mentioned timing");
  (/deposit|50%|upfront|half/i.test(text)?ok:no).push("You asked for a deposit");
  (/hi|hello|thanks|thank you|hey/i.test(text)?ok:no).push("You were friendly");
  S.rp=null;
  return"**Roleplay feedback**\nDid well: "+(ok.length?ok.join("; "):"nothing yet")+".\nMissing: "+(no.length?no.join("; "):"nothing, nice work")+".\n\n**Sample reply:** Hi! Thanks for reaching out. Quick question: what length and style do you want? 10 clips by Friday works for me at $X per clip with a 50% deposit. Shall I send an invoice?\n\nSend any message to start a new round.";

function wc(x){return String(x).split(/\s+/).length}
function lessonWords(l){
  var n=wc(l.intro);

  ["mistakes","assign"].forEach(function(k){(l[k]||[]).forEach(function(x){n+=wc(x)})});
  l.gloss.forEach(function(g){n+=wc(g[0])+wc(g[1])});
  return n;
}
function readMin(l){return Math.max(1,Math.round(lessonWords(l)/200))}
function vLesson(id){

    if(li)h+='<ul class="steps">'+li.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul>';

  });

  h+='<section class="card read"><h2>Key words</h2><dl class="gl">'+l.gloss.map(function(g){return '<div><dt>'+esc(g[0])+'</dt><dd>'+esc(g[1])+'</dd></div>'}).join("")+'</dl></section>';

  var right=0,done=0;

  h+='<section class="card read"><div class="row sp"><h2>Check your understanding</h2><span class="score">'+right+' / '+q.length+' correct</span></div>';
  q.forEach(function(qq,qi){
    var ans=S.qa[id+"_"+qi];
    h+='<div class="quiz"><strong>'+(qi+1)+'. '+esc(qq.q)+'</strong>'+qq.o.map(function(o,i){var c=ans==null?"":(i===qq.a?"right":(i===ans?"wrong":""));return '<button class="'+c+'" data-act="answer" data-id="'+id+'" data-q="'+qi+'" data-i="'+i+'">'+esc(o)+'</button>'}).join("")+(ans!=null?'<p class="small" style="margin-top:8px">'+(ans===qq.a?"Correct. ":"Not quite. ")+esc(qq.why)+'</p>':'')+'</div>';
  });

   '<p class="small mute">Prototype engine: replies come from built-in lesson rules until a real AI model is connected.</p></section>';
  return h;
}

  '<div class="setting" style="max-width:520px"><label for="checkout-name">Full name</label><input id="checkout-name" type="text" autocomplete="name" placeholder="Your full name" value="'+esc(fullName)+'" required maxlength="100"><small>Enter your first and last name.</small></div>'+

  '<section class="card"><span class="label">MONTHLY MEMBERSHIP</span><div class="row" style="align-items:baseline;gap:8px"><h2 style="font-size:2.2rem">$7.99</h2><span class="mute">USD / month</span></div><p class="mute">Billed monthly. Your subscription renews each month until cancelled through the payment provider.</p><ul class="steps"><li>All '+LESSONS.length+' academy lessons</li><li>Full AI learning assistant</li><li>Assignments and progress tracking</li><li>New lesson updates while subscribed</li></ul><button class="btn" style="width:100%;max-width:320px" data-act="checkout" data-plan="monthly">Pay $7.99 with Paystack ↗</button><p class="small mute">You will be redirected to Paystack to complete payment securely. Clipforge Academy does not collect or store your card details.</p></section>'+
  '<section class="card"><p class="small mute">After Paystack confirms your payment, Clipforge verifies it with the payment provider and activates your subscriber access automatically.</p></section>';

function selectSetting(label,key,opts,help){return '<div class="setting"><label for="pref-'+key+'">'+label+'</label><select id="pref-'+key+'" data-pref="'+key+'">'+opts.map(function(o){return '<option value="'+o[0]+'" '+(D.settings[key]===o[0]?'selected':'')+'>'+o[1]+'</option>'}).join('')+'</select>'+(help?'<small>'+help+'</small>':'')+'</div>'}
function vSettings(){
 var st=D.settings;
 var h='<section class="card"><span class="label">YOUR WORKSPACE</span><h1>Settings</h1><p class="mute">Make Clipforge feel right for the way you learn. Your preferences are saved in this browser.</p><div class="settings-tabs"><button data-act="settingsTab" data-tab="appearance" aria-pressed="'+((S.settingsTab||'appearance')==='appearance')+'">Appearance</button><button data-act="settingsTab" data-tab="assistant" aria-pressed="'+(S.settingsTab==='assistant')+'">Assistant</button><button data-act="settingsTab" data-tab="account" aria-pressed="'+(S.settingsTab==='account')+'">Your account</button></div></section>';
 var tab=S.settingsTab||'appearance';
 if(tab==='appearance'){
  h+='<section class="card"><h2>Appearance and accessibility</h2><p class="small mute">Choose how the academy looks and reads.</p><div class="settings-grid">'+
   selectSetting('Display mode','mode',[['comfortable','Comfortable'],['compact','Compact']])+
   selectSetting('Color theme','theme',[['dark','Dark'],['light','Light'],['system','Use device setting']])+
   selectSetting('Font','font',[['manrope','Manrope · default'],['system','System sans-serif'],['serif','Serif'],['mono','Monospace']])+
   selectSetting('Text size','textSize',[['small','Small'],['medium','Medium'],['large','Large'],['xlarge','Extra large']])+
   '<div class="setting"><div class="setting-row"><strong>Animated background</strong><input type="checkbox" data-pref-check="animatedBg" '+(st.animatedBg?'checked':'')+' aria-label="Animated background"></div><small>Subtle ambient movement. Automatically respects reduced-motion settings.</small></div></div><div class="row"><button class="btn sec" data-act="resetAppearance">Restore appearance defaults</button></div></section>';
 }else if(tab==='assistant'){
  h+='<section class="card"><h2>Assistant preferences</h2><p class="small mute">Set the response style and how a new assistant chat begins.</p><div class="settings-grid">'+
   selectSetting('Answer length','answerLength',[['short','Short · concise'],['standard','Standard · balanced'],['detailed','Detailed · expanded']])+
   selectSetting('Starting mode','startingMode',[['balanced','Balanced'],['direct','Direct'],['deep','Deep dive']])+
   '<div class="setting"><div class="setting-row"><strong>Suggestion buttons</strong><input type="checkbox" data-pref-check="suggestions" '+(st.suggestions?'checked':'')+' aria-label="Suggestion buttons"></div><small>Show example questions above the chat box.</small></div></div><div class="row"><button class="btn sec" data-act="clearChat">Clear assistant conversation</button></div></section>';
 }else if(tab==='account'){
  h+='<section class="card"><h2>Your account</h2><div class="row sp"><span class="badge guest">'+(S.as==='subscriber'?'SUBSCRIBER':'GUEST PREVIEW')+'</span><span class="pill mute">'+(S.as==='subscriber'?'Paid access':'Free access')+'</span></div><p class="small mute">Account details are stored locally in this demo. Real sign-in, billing and account recovery need a secure backend.</p><div class="settings-grid"><div class="setting"><label for="account-name">Display name</label><input id="account-name" type="text" data-account="displayName" value="'+esc(D.account.displayName||'')+'" placeholder="Your name"></div><div class="setting"><label for="account-email">Email address</label><input id="account-email" type="email" data-account="email" value="'+esc(D.account.email||'')+'" placeholder="you@example.com"></div></div><div class="row"><button class="btn" data-act="saveAccount">Save account details</button><button class="btn sec" data-act="accountStatus">Refresh access status</button></div><div class="box"><strong>Subscription</strong><p class="small">'+(S.as==='subscriber'?'Your demo account currently has subscriber access.':'You are browsing as a guest. Subscribe from Plans to view the available options.')+'</p><button class="btn sec sm" data-act="go" data-v="plans">View plans</button></div><p class="small mute">For safety, do not enter payment card details or passwords into this demo page.</p></section>';
 }
 return h;
}
function applySettings(){var st=D.settings||{};document.documentElement.setAttribute('data-theme',st.theme||'light');document.body.classList.toggle('motion-bg',!!st.animatedBg);document.body.classList.remove('layout-compact','font-system','font-serif','font-mono','text-small','text-medium','text-large','text-xlarge');if(st.mode==='compact')document.body.classList.add('layout-compact');if(st.font&&st.font!=='manrope')document.body.classList.add('font-'+st.font);document.body.classList.add('text-'+(st.textSize||'medium'));}

function vNotFound(){return '<section class="card lock"><h2>Page not found</h2><p class="mute">There is nothing at this address.</p><button class="btn" data-act="go" data-v="home">Go home</button></section>'}

function render(){
  var v=S.view,body;
  if(v==="home")body=vHome();else if(v==="lessons")body=vLessons();else if(v==="assistant")body=vAssistant();else if(v==="plans")body=vPlans();else if(v==="settings")body=vSettings();else body=vNotFound();
  applySettings();document.getElementById("app").innerHTML=vHeader()+'<div class="shell">'+vNav()+'<main class="main">'+body+'</main></div>';
  var c=document.getElementById("chat");if(c)c.scrollTop=c.scrollHeight;
}
function go(v){
  var r=routeFor(S.as,v);S.view=r;S.lesson=null;
  try{if(location.hash!=="#"+v)history.replaceState(null,"","#"+v)}catch(e){}
  render();window.scrollTo(0,0);
}
function sendChat(text){
  text=text.trim();if(!text)return;
  var lvl=aiLevel(S.as);if(lvl==="locked"){toast("Subscribe to unlock the AI assistant.");return;}
  if(lvl==="limited"){if(S.guestUsed>=3){toast("Free preview messages used. Subscribe to continue.");return;}S.guestUsed++;}
  S.chat.push({r:"me",t:text});S.chat.push({r:"ai",t:compose(text,S.mode)});
  D.aiTotal++;D.ai[6]++;save();render();var i=document.getElementById("chatIn");if(i)i.focus();
}
async function startCheckout(planId){
  var nameEl=document.getElementById("checkout-name");
  var emailEl=document.getElementById("checkout-email");
  var fullName=(nameEl&&nameEl.value||"").trim().replace(/\s+/g," ");
  var email=(emailEl&&emailEl.value||"").trim();
  if(fullName.length<2){toast("Enter your full name first.");if(nameEl)nameEl.focus();return;}
  if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast("Enter a valid email address first.");if(emailEl)emailEl.focus();return;}
  if(planId!=="monthly"){toast("Choose the monthly membership.");return;}
  try{
    toast("Preparing secure Paystack checkout…");
    var response=await fetch("/api/checkout",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({fullName:fullName,email:email,plan:planId})});
    var result=await response.json();
    if(!response.ok||!result.authorization_url)throw new Error(result.error||"Could not start checkout.");
    D.account=D.account||{};D.account.displayName=fullName;D.account.email=email;save();
    window.location.href=result.authorization_url;
  }catch(err){toast(err.message||"Checkout could not be started. Please try again.");}
}
function act(a,d){
  if(a==="go")go(d.v);
  else if(a==="openLesson"){S.lesson=d.id;render();window.scrollTo(0,0)}
  else if(a==="backLessons"){S.lesson=null;render()}
  else if(a==="answer"){S.qa[d.id+"_"+d.q]=+d.i;render()}
  else if(a==="complete"){if(!canOpen(S.as,d.id)){toast("Subscribe to unlock this lesson.");return;}D.progress[d.id]=!D.progress[d.id];save();render();toast(D.progress[d.id]?"Lesson marked complete":"Marked as not done")}
  else if(a==="mode"){if(S.as!=="subscriber")return;S.mode=d.m;render()}
  else if(a==="checkout"){startCheckout(d.plan)}
  else if(a==="settingsTab"){S.settingsTab=d.tab;render()}
  else if(a==="resetAppearance"){D.settings.mode="comfortable";D.settings.theme="light";D.settings.font="manrope";D.settings.textSize="medium";D.settings.animatedBg=true;save();render();toast("Appearance defaults restored")}
  else if(a==="clearChat"){S.chat=[];S.chat.push({r:"ai",t:"Conversation cleared. What would you like to learn?"});render()}
  else if(a==="saveAccount"){D.account.displayName=(document.getElementById("account-name")||{}).value||"";D.account.email=(document.getElementById("account-email")||{}).value||"";save();toast("Account details saved")}
  else if(a==="accountStatus"){toast("Access status: "+(S.as==="subscriber"?"subscriber":"guest preview"))}
  else if(a==="suggest"){sendChat(d.text||"")}
}
var app=document.getElementById("app");
app.addEventListener("click",function(e){var t=e.target.closest("[data-act]");if(!t||t.disabled)return;act(t.getAttribute("data-act"),t.dataset)});
app.addEventListener("change",function(e){var t=e.target;if(t.hasAttribute("data-pref")){D.settings[t.getAttribute("data-pref")]=t.value;if(t.getAttribute("data-pref")==="startingMode")S.mode=t.value;save();applySettings();toast("Preference saved")}else if(t.hasAttribute("data-pref-check")){D.settings[t.getAttribute("data-pref-check")]=t.checked;save();applySettings();render()}else if(t.hasAttribute("data-flag")){D.flags[t.getAttribute("data-flag")]=t.checked;save();toast("Feature flag saved")}});
app.addEventListener("submit",function(e){e.preventDefault();var f=e.target.getAttribute("data-form");if(f==="chat"){var i=document.getElementById("chatIn");sendChat(i.value)}});
window.addEventListener("hashchange",function(){var v=(location.hash||"").slice(1);if(v&&v!==S.view&&["home","lessons","assistant","plans","settings"].indexOf(v)>=0)go(v)});
var h0=(location.hash||"").slice(1);if(["home","lessons","assistant","plans","settings"].indexOf(h0)>=0)S.view=routeFor(S.as,h0);
render();
fetch("/api/me",{credentials:"same-origin"}).then(function(r){return r.ok?r.json():{authenticated:false}}).then(function(account){
  S.as=(account&&account.active)?"subscriber":"guest";
  render();
  var params=new URLSearchParams(location.search);
  if(params.get("payment")==="success"&&S.as==="subscriber")toast("Payment verified. Subscriber access is now active.");
  else if(params.get("payment")==="failed")toast("Payment was not completed. You can try again.");
}).catch(function(){S.as="guest";render()});
})();
