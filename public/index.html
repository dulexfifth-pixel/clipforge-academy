/* ---------- lesson content ---------- */
var LESSONS=[
{id:"m1",title:"Clipping from zero",
 intro:"This lesson takes you from knowing nothing to cutting, framing and exporting your first short clip from a long gameplay video. Read it slowly, do the assignments, and answer the questions at the end before you move on. You do not need to be good at editing yet. You only need to be willing to watch closely and practice.",
 sections:[
 {h:"What clipping is, and what it is not",
  p:["Clipping means taking a long video, such as a 3-hour stream or a 40-minute gameplay recording, and pulling out one short moment that works on its own. The finished piece is usually 15 to 45 seconds long and is posted on TikTok, Instagram Reels or YouTube Shorts. A person who has never seen the original video should still understand it and feel something: surprise, laughter, tension or respect for a skill.",
   "Clipping is not just cutting a random piece of video. A cut-out piece with no beginning and no ending feels confusing, and viewers leave in two seconds. A clip is a tiny story with a setup, some tension and a payoff. Your job is to find that tiny story hidden inside a long, mostly boring recording and present it cleanly.",
   "Clipping is also not a guaranteed way to earn money. Some people build audiences or get paid by creators, and many people try for months with little result. Treat it as a skill you are building. The skill is real and useful: watching carefully, choosing well, editing quickly and communicating with the person whose content you are working with. That skill can lead to different opportunities, and nobody can promise you which one."],
  ex:"Example: a streamer plays a GTA-style game for three hours. Most of it is driving, menus and chatting. At 1:42:10 he steals a car, a police helicopter appears, he drives off a pier and lands on a boat. That 25-second moment is the clip. The other two hours and 59 minutes are raw material."},
 {h:"The anatomy of a good clip",
  p:["Every strong short clip has four parts, even if the whole thing lasts only 20 seconds. First is the hook, the first one to two seconds, which gives the viewer a reason to stay. Second is the setup, which gives just enough context to understand what is going on. Third is the tension, the stretch where the viewer wonders what will happen. Fourth is the payoff, the moment that answers the question, whether it is a funny reaction, a big crash or a clever escape.",
   "Beginners often put the payoff at the end and the hook nowhere. The video starts with the character walking, then driving, then something happens at second 19. By then the viewer has already swiped away. A better order is to show a tiny piece of the payoff or the stakes first, then rewind to the setup, then deliver the full payoff. Another good order is to start in the middle of the action and give context with a caption.",
   "The last idea is the loop. On short-form platforms a video often replays automatically. If your ending connects naturally back to your beginning, people may watch a second time without noticing. You do not need to engineer this on day one, but keep it in mind when you choose where to end the clip."],
  ol:["Hook: the first 1 to 2 seconds. Show the most surprising frame or say the most interesting line.","Setup: 3 to 8 seconds. Only the context the viewer needs.","Tension: the stretch where the outcome is unknown.","Payoff: the answer, such as the crash, the escape, the joke or the skill.","Ending: stop soon after the payoff. Do not let it fade out slowly."]},
 {h:"Choosing what to clip: the moment hunt",
  p:["Finding good moments is the most valuable clipping skill, and it is mostly pattern recognition. When you watch a long video, you are not watching for fun. You are scanning for signals. A signal is something that would make a stranger stop scrolling.",
   "Six signals appear again and again. The first is surprise: something unexpected happens. The second is a strong reaction: the player shouts, laughs, goes silent or breaks something. The third is skill: a difficult move done well, such as a perfect drift or a one-shot kill. The fourth is chaos: many things go wrong at once. The fifth is a story: a mini-plot with a clear before and after. The sixth is a quotable line: a sentence people want to repeat or comment on.",
   "In GTA-style games, strong moments include police chases that end in a funny way, physics glitches, near misses, stunts, wrong turns that become disasters, funny interactions with other players, and heists that fall apart. In other games the same signals show up as clutch plays, fails and unexpected endings.",
   "While you watch, keep a simple notes file. Each time you feel a spike of interest, write the timestamp and one line about why. Do not edit yet. After the whole video, review your notes and rank the moments. Often your first instinct is right, but sometimes a moment you ignored becomes stronger when you see it again with a good hook."],
  ul:["Surprise: the opposite of what you expected happened.","Reaction: the human response is the funniest part.","Skill: the viewer thinks, how did they do that?","Chaos: everything goes wrong in a fun way.","Story: a clear before and after in under 40 seconds.","Quotable line: a sentence that works as a caption by itself."],
  ex:"Example notes file: 00:12:40 funny NPC reaction (reaction). 01:42:10 pier jump onto boat (surprise + chaos). 02:15:05 streamer says: I am never driving again (quotable). Ranking: pier jump first, quote second as a short text-led clip, NPC reaction third."},
 {h:"Setting up for free",
  p:["You do not need to spend money to begin. Use what you already have. For recording or downloading gameplay that you have permission to use, your phone or computer likely has a built-in screen recorder. For editing, CapCut has a free tier that covers cutting, captions, zooms and exporting. For organizing, a free Google Drive or a plain folder on your computer is enough.",
   "Create a simple folder structure on day one. A good one has four folders: 1_Raw for original videos, 2_Notes for your timestamps, 3_Edits for projects in progress and 4_Finished for exported clips. Use clear names like 2026-11-17_streamerName_pierJump_v1. Clear names save a lot of time when you have dozens of files, and they make it easy to find proof of permission later.",
   "Lastly, decide where you will watch your own work. The best place is your phone, because that is where your audience will watch. A clip that looks fine on a laptop can look wrong on a phone, with captions too small or important action hidden at the edge."],
  l:["Screen recorder: built into most phones and computers.","Editor: CapCut free tier.","Storage: a folder structure or free cloud drive.","Notes: any notes app or a plain text file.","Test device: your own phone."]},
 {h:"Your first cut, step by step",
  p:["Now put it together. This is a full walkthrough you can follow with a short video. Do not worry if your first attempt looks rough. The goal of the first clip is to finish one, not to make it perfect. Finishing teaches you more than reading."],
  ol:["Open your notes and pick the single strongest moment.","Create a new project in your editor and set the ratio to 9:16 (vertical).","Import the raw video and find the moment. Mark where the setup begins and where the payoff ends.","Trim to just that section. Aim for 15 to 40 seconds.","Cut out dead time: waiting, loading screens, walking with nothing happening.","Decide your hook. Either start on the most surprising frame, or place a short text hook over the first frame.","Add captions for any important speech, keeping 3 to 5 words on screen at a time.","Check the audio. Game sound and voice should both be clear. Lower any music so voices stay easy to hear.","Watch the whole clip on your phone with the sound off, then with the sound on.","Export at 1080p vertical and save it in 4_Finished with a clear file name."]},
 {h:"Length, framing and the safe zone",
  p:["Short-form platforms show buttons, usernames and captions over your video. If you put important action or text in those areas, viewers cannot see it. This is called the safe zone problem. A good habit is to keep key action and text away from the very top, the very bottom and the right edge where buttons appear.",
   "Gameplay is usually recorded in wide format, 16:9. To fill a vertical frame you can crop into the action, or place the gameplay in the middle and use a blurred copy of it as the background above and below. Choose the approach that keeps the main action large enough to see. If the action is small, crop in and follow it with a gentle zoom.",
   "For length, shorter is not always better. A clip should be exactly as long as the story needs. If the payoff happens at second 14, end at second 16, even if you planned for 30. If the story needs 35 seconds, make sure each second earns its place. Test yourself: could you remove any second without losing meaning? If yes, remove it."]},
 {h:"A full worked example from start to finish",
  p:["Here is the pier jump clip from the beginning, processed step by step so you can see the decisions. The raw footage shows the streamer stealing a car at 1:41:50, a helicopter spotting him at 1:42:00, a chase through a street, and the jump at 1:42:10 with a splash at 1:42:14. He yells and laughs for about 6 seconds.",
   "Decision one is the hook. The strongest frame is the car in mid-air above the water. Put 1 second of that frame at the beginning with the text: He should not have done that. Decision two is the setup. Cut back to the helicopter spotting him and the chase starts, trimmed to 6 seconds of real action. Decision three is the payoff. Show the full jump and the splash, slowed slightly for 1 second for emphasis. Decision four is the reaction. Keep 3 seconds of the streamer laughing because the reaction is half the joke. Then stop.",
   "Total length is about 24 seconds. The captions show only the important lines. The music from the game stays low. The first draft takes some time, but the second clip takes less, and by the tenth you will notice you are working much faster because you recognize the same decisions."],
  ex:"Before: a 3-hour stream. After: a 24-second clip with a hook frame, a 6-second setup, a 1-second slow-motion payoff and a 3-second reaction."},
 {h:"How to review your own clip",
  p:["After you finish, review the clip like a stranger. Ask five questions. Did the first two seconds give a reason to stay? Could a new viewer understand what is happening? Was there any moment where nothing happened? Is the text readable on a phone? Does it end right after the payoff?",
   "Then show it to one person who has not seen the original. Do not explain anything. Watch their face. If they smile or lean in, you did well. If they look confused, note exactly where. Their confusion is more valuable than their compliments.",
   "Keep a simple log with the clip name, what you changed, and what you learned. After ten clips you will see patterns in your own mistakes, and fixing patterns is how you improve fast."]},
 {h:"A weekly routine that is realistic",
  p:["Consistency beats intensity. A beginner routine might be two sessions per week of about 90 minutes each. In session one you watch one long video, build the notes file and pick the best three moments. In session two you edit those three moments, export them and write a short log entry about what you learned.",
   "Do not try to learn everything at once. For the first month, focus on only two things: choosing strong moments and putting a clear hook in the first two seconds. Everything else can come later. When these two skills feel automatic, move to captions, pacing and sound, which the next lesson covers."]}
 ],
 mistakes:["Starting the clip with slow walking or menus instead of the hook.","Choosing a moment that only makes sense if you watched the whole stream.","Keeping dead air because it feels like a pity to cut.","Putting text or action where platform buttons will cover it.","Ending long after the payoff so the clip fades into nothing.","Judging the clip on a laptop only, and never on a phone.","Editing before finishing the moment hunt, so you waste time on weak moments."],
 gloss:[["Clip","A short video made from one moment of a longer video."],["Hook","The first 1 to 2 seconds designed to stop the viewer from swiping."],["Payoff","The moment that answers the tension, such as the crash or the joke."],["Dead air","Time in a video where nothing useful happens."],["9:16","The vertical video shape used by TikTok, Reels and Shorts."],["Safe zone","The part of the screen not covered by platform buttons and text."],["Raw footage","The original, unedited video."],["Loop","When the end of a clip connects to its start so replays feel natural."]],
 assign:["Pick one 10-minute gameplay video that you have permission to use. Watch it once and write down at least 5 timestamps with a one-line reason each.","Rank your 5 moments from strongest to weakest and write why you placed the top one first.","Cut your top moment into a 15 to 40 second clip following the 10 steps above. Export it vertically.","Watch your clip on your phone with the sound off, then on. Write down 3 things you would change.","Show the clip to one person who has not seen the original and write down exactly where they looked confused or bored."],
 quiz:[
 {q:"Where should the most surprising moment or line go in a short clip?",o:["At the very end","In the first 1 to 2 seconds","Exactly in the middle"],a:1,why:"Viewers decide almost instantly whether to swipe. The hook has to come first, and the setup follows."},
 {q:"Which is NOT one of the six signals for a good moment?",o:["Surprise","Skill","The video having a long intro"],a:2,why:"A long intro is the opposite of a signal. It is usually dead air you should cut."},
 {q:"You finished the payoff at second 14 of your planned 30-second clip. What should you do?",o:["Add filler so it reaches 30 seconds","End shortly after the payoff","Repeat the clip twice"],a:1,why:"A clip should be as long as its story needs. Ending soon after the payoff keeps the pace tight."},
 {q:"Why test your clip on a phone?",o:["Phones export faster","That is where most viewers watch, and it shows safe zone and text size problems","It improves video quality"],a:1,why:"Captions and action can look fine on a laptop and be unreadable or covered on a phone."},
 {q:"What is the best way to learn from a first clip?",o:["Delete it and start again","Show a stranger without explaining and note where they get confused","Only ask friends who will praise it"],a:1,why:"Honest confusion shows you what to fix. Praise feels nice but teaches less."}
 ]},

{id:"m2",title:"Hooks, captions and retention in CapCut",
 intro:"This lesson turns a rough clip into one that holds attention. You will learn what retention means, how to write hooks, how to cut dead air, how to caption properly, how to use zoom and sound, and how to read your own results. Everything here can be done in the free tier of CapCut, and the ideas work in any editor.",
 sections:[
 {h:"What retention is and why it matters",
  p:["Retention is how much of your video people watch. If a 20-second clip is watched on average for 12 seconds, its average retention is 60 percent. Platforms tend to show videos more widely when viewers keep watching, so retention is one of the most useful numbers you can learn to read.",
   "Think of a retention graph as a line that starts at 100 percent and falls as people leave. The biggest drop usually happens in the first two seconds. If you fix only one thing, fix the start. After that, look for smaller drops in the middle and make sure the ending does not drag.",
   "No editor can force people to watch, and nobody can promise a result. What you can do is remove reasons to leave and add reasons to stay. Every technique in this lesson does one of those two things."]},
 {h:"Getting started in CapCut",
  p:["Open CapCut and start a new project. Import your raw clip and set the canvas ratio to 9:16. Check the frame rate matches your source, commonly 30 fps, so the motion looks smooth. Learn the five areas of the screen: the media panel where your files live, the preview where you watch, the timeline where you build, the tool panel for effects and text, and the export button.",
   "The timeline is the heart of editing. Video sits on the main track. Text, stickers and sound effects go on separate tracks above or below. A good habit is to name or color your tracks so you always know where things are. Learn three keys first: split at the playhead, delete, and undo. With only these three you can already do most of what you need.",
   "Before you edit, save a copy of your project and name it clearly. If you make a mistake, you can go back. Also turn on any autosave option so you never lose work after a crash."],
  ul:["Media panel: your imported video, audio and images.","Preview: shows what viewers will see.","Timeline: where cuts, text and sound are arranged.","Tool panel: text, captions, effects, transitions, audio.","Export: saves the finished video to your device."]},
 {h:"Writing hooks that work",
  p:["A hook is the first thing a viewer sees or hears. It has one job: make a stranger curious enough to keep watching for the next few seconds. You can write the hook as on-screen text, as a spoken line, as the first image, or as a mix of all three.",
   "Five reliable hook patterns exist. Result first shows the exciting outcome and then goes back to how it happened. Stakes tells the viewer what is at risk. Question asks something the viewer wants answered. Contrast sets up an expectation and then breaks it. Quote uses a surprising line from the video itself.",
   "A good hook is specific and honest. If the hook promises something the clip does not deliver, people feel tricked and leave, and they remember that. Keep the hook short, usually under 8 words, and make it readable in under two seconds."],
  ol:["Result first: He drove off a pier and lived. (Then show the chase.)","Stakes: One wrong turn and the heist is over.","Question: Can you escape 5 stars with a bicycle?","Contrast: Everyone thought this was an easy getaway.","Quote: I am never driving again. (Then show why.)"],
  ex:"GTA-style example: the first frame shows the car in mid-air above the water with the text: He should not have done that. Two seconds later the clip cuts back to the helicopter spotting him, and the viewer wants to see how he got there."},
 {h:"Cutting dead air and tightening pace",
  p:["Dead air is any moment that gives the viewer no new information or feeling. It includes long pauses, repeated menu screens, walking with nothing happening, and slow starts. Cutting dead air is the quickest improvement you can make.",
   "The basic tool is the jump cut. Split the clip where the useful part ends, delete the empty part, and join the useful parts together. If the cut feels abrupt, add a tiny zoom change or a sound effect to hide the jump. Many popular clips use many cuts on purpose, and viewers are used to it.",
   "You can also change speed. Speed up a boring stretch such as a long drive to 2x or 4x, and slow down the key second of the payoff to give it weight. Do not overuse slow motion. One strong slow moment is much better than five weak ones.",
   "A useful rule is that something should change every 2 to 3 seconds. A change can be a cut, a zoom, a new caption, a sound effect or an on-screen sticker. If nothing changes for five seconds, ask whether the clip needs that stretch."]},
 {h:"Captions and subtitles that people can read",
  p:["Many people watch with the sound off, so captions are essential, and they also help viewers who are deaf or hard of hearing. CapCut has an auto caption feature that listens to the audio and writes text onto the timeline. It is quick, but it makes mistakes, especially with slang, accents and loud game sound. Always read every line and fix the errors by hand.",
   "Style matters more than most beginners think. Use a bold, simple font with strong contrast against the video. White text with a dark outline is readable on most backgrounds. Keep 3 to 5 words on screen at once and break lines at natural pauses. Highlight the key word in a different color to add energy, but use only one highlight color so it does not look messy.",
   "Place captions in the safe zone, usually in the middle or lower-middle of the frame, away from the platform buttons. Check on your phone that the text is not covered by the username or description area."],
  l:["Use auto captions, then correct every mistake.","Choose one bold font and keep it for all your clips.","Three to five words at a time, no long paragraphs.","One highlight color for emphasis.","Keep text inside the safe zone."]},
 {h:"Zoom, motion and visual change",
  p:["Movement helps the eye stay engaged. A slow zoom into the action draws attention to the important area. A quick punch-in zoom on a funny reaction adds emphasis. These effects are made with keyframes: you set a start size and an end size, and the editor fills in the movement between them.",
   "To make a simple zoom, place the playhead at the start of the moment, add a keyframe at 100 percent size, move forward a second or two, and add another keyframe at 115 to 130 percent. Preview it. The movement should feel natural, not dizzying. Small is usually better.",
   "You can also use stickers, arrows or circles to point at the important detail. If something small happens in a big scene, such as a tiny car in the distance, a circle or arrow helps the viewer see it. Use these tools to guide attention, not to cover the video."]},
 {h:"Sound: game audio, voice and effects",
  p:["Sound is half the experience. First make sure the voice and the main game sound are clear. If the streamer speaks over loud music, lower the music. Keep your final volume consistent from the start to the end of the clip so viewers do not need to adjust it.",
   "Sound effects can add punch. A short whoosh on a cut, a small hit on a zoom, or a pop when a caption appears gives rhythm. Use them lightly. If every second has a sound effect, it becomes noise.",
   "Be careful with music. Songs are usually protected by copyright, and a track that is fine in one place may not be allowed in another. Prefer the music and sound libraries offered by the platform or editor for the kind of account you have, read their terms, and keep a note of where each track came from. The next lessons cover permissions in more detail."]},
 {h:"Exporting and preparing to post",
  p:["When your edit is finished, export at 1080 by 1920 resolution, 30 fps, and a high-enough quality setting for clean text. Longer exports take more time, so be patient and do not close the app. After exporting, watch the whole file again on your phone before posting. Exports sometimes contain surprises such as a missing caption or a clipped frame.",
   "Write a short description that fits the clip. It can include a few relevant words people may search for, but avoid stuffing it with unrelated tags. Posting at similar times each week helps you compare results more fairly, but the best time varies by audience, so test and watch your own numbers."]},
 {h:"Reading your results and improving",
  p:["After posting, check your analytics once a day for a few days. Look at views, average watch time, percentage watched and, if available, where viewers drop off. These numbers tell you what to change in the next clip. Do not judge yourself by a single clip. Look at a group of five to ten.",
   "If many viewers leave in the first two seconds, improve your hook. If they leave in the middle, tighten the pace or cut a slow section. If they watch to the end but do not interact, maybe the ending needs a stronger payoff or a clearer call to follow.",
   "Make one change at a time when you can. If you change the hook, the captions and the music at once, you will not know which change helped. Small, steady experiments teach you far more than random big changes."]}
 ],
 mistakes:["Trusting auto captions without reading them.","Using tiny text that disappears on a phone screen.","Adding effects on every second until the video feels noisy.","Using a hook that promises something the clip does not deliver.","Leaving loud music over the voice.","Changing five things at once and not knowing what worked.","Using copyrighted music without checking whether it is allowed."],
 gloss:[["Retention","How much of a video viewers actually watch."],["Jump cut","A cut that removes the empty part between two useful moments."],["Keyframe","A marker that tells the editor a setting, such as size, at a certain moment."],["Auto captions","Text generated automatically from the audio. It needs manual fixing."],["Highlight word","A key word shown in a different color for emphasis."],["fps","Frames per second. Commonly 30 for short-form video."],["Average view duration","The average time viewers spend watching your video."],["Call to action","A short line asking the viewer to do something, such as follow."]],
 assign:["Take the clip from lesson 1. Write 5 different hook lines using the 5 patterns in this lesson, then choose the best and explain why.","Remove all dead air from your clip. Write down how many seconds you removed.","Add auto captions, then correct every mistake. Choose one font and one highlight color.","Add one simple zoom with keyframes on the most important moment.","Export, post or save the clip, and compare it with your first version. Write 3 differences you notice."],
 quiz:[
 {q:"What does cutting dead air mainly improve?",o:["File size only","Retention","The game's difficulty"],a:1,why:"Dead air gives viewers a reason to leave. Cutting it keeps more of them watching."},
 {q:"Which hook pattern shows the outcome first and then explains how it happened?",o:["Stakes","Result first","Quote"],a:1,why:"Result first opens with the exciting outcome and then goes back to the setup."},
 {q:"What should you always do after using auto captions?",o:["Nothing, they are perfect","Read every line and fix mistakes","Delete all captions"],a:1,why:"Auto captions often misread slang, accents and loud game sound."},
 {q:"Roughly how often should something visually change in a clip?",o:["Every 2 to 3 seconds","Only once at the start","Every 30 seconds"],a:0,why:"Regular small changes, such as a cut, zoom or caption, keep the eye engaged."},
 {q:"You changed the hook, captions and music at the same time and views improved. What is the problem?",o:["There is no problem","You cannot tell which change helped","The platform made a mistake"],a:1,why:"Changing one thing at a time shows you what actually works."}
 ]},

{id:"m3",title:"Finding clients and getting paid",
 intro:"This lesson shows you how to go from having a few clips to having real conversations with creators who might need your help. You will build a small portfolio, find creators, write messages, handle replies, agree on scope and price, deliver work and get paid in a safe and professional way. Nothing here is a promise of income. It is a method you can test with real people.",
 sections:[
 {h:"Who pays for clips, and why",
  p:["Creators who record long videos, such as streams, podcasts and long gameplay sessions, often do not have time to turn them into short clips. Short clips help them reach new viewers, but cutting them takes hours. Some creators will pay another person to do that work. That is the opportunity: you save them time and you deliver results they are happy to post.",
   "Not every creator needs or can afford a clipper. Many small creators have no budget at all. Some larger creators already have editors. The best prospects are creators who post long content regularly, have a growing audience, post few or no shorts, and seem to care about growth. You will test your guesses and learn from responses.",
   "Always remember the buyer's point of view. They are not buying editing hours. They are buying shorts they can post that make their channel look good. Talk about outcomes, saved time and consistency."]},
 {h:"Building a small portfolio",
  p:["Before you contact anyone, make a portfolio of three clips. A portfolio is simply proof that you can do the work. It should be easy to open, quick to watch and clearly in the style you want to be hired for. If you want to do GTA-style gameplay clips, your three clips should be GTA-style gameplay clips.",
   "Use footage you are allowed to use. Your own gameplay is safest. If you use someone else's footage, get written permission first. A portfolio built on footage you were not allowed to use can cause problems later. The next lesson covers permissions.",
   "Put the three clips in one folder or one simple page, and give each a short title and a one-line description of what you did, such as cut from a 2-hour stream, added hook and captions. Make sure the link opens without needing to log in. Test it on a different device."],
  l:["Three clips, same style as the work you want.","Footage you own or have written permission to use.","One shareable link that opens on a phone.","A one-line description under each clip.","Your name and a way to contact you."]},
 {h:"Finding creators to contact",
  p:["Make a list of 20 creators. Search on the platforms you use for the kind of content you like. Look for creators with a few thousand followers up to a medium-sized audience, who post long videos regularly. Check whether they post shorts. Check whether their long videos contain good moments you could clip.",
   "Create a simple tracking sheet with these columns: name, platform, link, why they are a good fit, one specific moment you noticed, date you contacted them, reply status and next step. This sheet is your pipeline. Without it you will forget who you contacted and when to follow up.",
   "Avoid contacting people in ways that feel invasive. Use the contact method they present publicly, such as a business email in their profile or a business inbox. If their page says no unsolicited messages, respect that."]},
 {h:"Studying a creator before you message",
  p:["The difference between a message that gets ignored and one that gets a reply is specificity. Spend 15 minutes watching one recent long video from the creator. Write down two or three specific moments that would make good shorts. Note the timestamps. Make one sample clip from one moment if you can.",
   "This effort is small compared to the number of generic messages you could send, and it works better. A creator can tell right away whether you looked at their content or just copied and pasted. When you mention a real moment, you prove you paid attention."]},
 {h:"Writing the first message",
  p:["A strong first message is short, specific and easy to answer. It has four parts: a greeting using their name, one specific observation about their content, a sample or offer, and one easy question. It should be readable in under 20 seconds. Do not attach a long biography or a list of prices in the first message.",
   "Adapt the style to the platform. WhatsApp and Instagram messages are more casual and shorter. Email can be slightly more formal with a clear subject line. Always be polite and never pushy."],
  ex:"WhatsApp: Hi Tolu, I watched your last stream. The moment at 41:10 when the car lands on the boat would make a great short. I made a 20-second sample here: [link]. Would you like me to cut 5 more from that stream?\n\nInstagram DM: Hey Ada, love your GTA streams. The pier jump at 1:42 is a perfect short. I put together a quick version: [link]. Is this something you would want more of?\n\nEmail subject: A 20-second short from your last stream. Body: Hello Tunde, I watched your latest stream and clipped the moment at 58:20 into a short. Here is the link. If you like it, I can send a few more as a trial. Thank you for your time."},
 {h:"Following up without being annoying",
  p:["Many creators are busy and miss messages. A polite follow-up is normal and professional. Wait three to four days after the first message, then send one short reminder. If there is still no reply after another five to seven days, send one final note and then move on. Three messages in total is plenty.",
   "A follow-up should add something, not just repeat the question. For example, send a second sample clip, or mention a new moment from their latest video. Keep the tone friendly and make it easy for them to say no."],
  ex:"Follow-up: Hi Tolu, just a quick follow-up. I saw your new stream and the moment at 12:05 would also work well as a short. Here is a version: [link]. No pressure at all, and thanks for taking a look.\n\nFinal note: Hi Tolu, I will not keep messaging you. If you ever need help turning streams into shorts, I would be glad to help. All the best with the channel."},
 {h:"Handling replies: realistic conversations",
  p:["When someone replies, respond quickly and clearly. Here are three common situations. In each, notice how the answers are friendly, short and move the conversation forward."],
  ex:"Situation 1: they are interested.\nCreator: Hey, this looks good. What do you charge?\nYou: Thank you! It depends on how many clips and how fast you need them. Could you tell me roughly how many shorts you want per week and which videos to use? Then I can send a clear offer today.\n\nSituation 2: they have no budget.\nCreator: I like it but I cannot pay right now.\nYou: Totally understand. If you like, I can do one trial clip at no charge so you can see the results, and we can talk again after that.\n(Only offer a free trial if you are happy to give it, and limit it to one clip.)\n\nSituation 3: they say no.\nCreator: Thanks, but I already have an editor.\nYou: No problem, thank you for letting me know. If anything changes, I am happy to help. Good luck with the channel."},
 {h:"Pricing basics and packages",
  p:["Pricing is hard at the start, and there is no single correct answer. Begin by deciding what one unit of work is. For example, one short clip of up to 45 seconds with a hook and captions. Estimate how long it takes you, including revisions. Decide the lowest price you would be happy to accept for that time. Then check what other beginners charge in your market to see whether your price is realistic.",
   "Packages make it easier for clients to say yes. A package might be 5 clips for one price, delivered in one week, with one round of revisions. Offering two or three options lets the client choose, and most choose the middle one. Always describe exactly what is included.",
   "You may raise prices as your skill and results improve. Do not apologize for your price, and do not drop it immediately when someone pushes back. If the budget is lower, reduce the scope, such as fewer clips, instead of working for much less."],
  ul:["Define one unit: one short clip up to 45 seconds.","State what is included: hook, captions, one revision.","State the delivery time.","Offer two or three package sizes.","Never promise views, followers or income to the client."]},
 {h:"Agreeing scope and taking a deposit",
  p:["Before you start, confirm the details in writing. Even a simple message on WhatsApp counts as a record. The details you should agree on are the number of clips, the video or videos they come from, the style, the deadline, the number of revisions, the price and the payment terms.",
   "Ask for a deposit before starting, commonly 30 to 50 percent. A deposit protects your time and shows the client is serious. Explain it politely: I start work once the deposit is received, and the rest is due on delivery. Many professionals work this way.",
   "If you are new and the client hesitates, you can reduce the risk by starting with a small first job, such as 2 or 3 clips. When the first job goes well, trust grows and bigger jobs follow."],
  ex:"You: Great, here is what I understand. 10 clips from your next two streams, up to 45 seconds each, with hooks and captions, delivered within 5 days of getting the videos, one round of revisions. Price: [amount]. I start after a 50 percent deposit, and the rest is due when you approve the clips. Does that work for you?"},
 {h:"Delivering work and handling revisions",
  p:["Deliver in the way the client prefers, usually through a shared folder link or file transfer. Name files clearly, check that links open, and send a short message listing what is included. Ask for feedback within a set time.",
   "Revisions are normal. A revision means changing the work to match what was agreed, such as fixing a caption or trimming a second. It does not mean a complete redo of everything because the client changed their mind. That is why the number of revisions is in the scope. When feedback arrives, thank them, repeat back what you will change, and deliver the changes by the promised time.",
   "If a client asks for much more than agreed, stay polite and offer an option: That sounds like a new set of clips. I can quote that as an extra package, if you like."]},
 {h:"Getting paid safely",
  p:["Use payment methods that give both sides a record, such as bank transfer or a recognized payment service available in your country. Keep screenshots or receipts. Send a simple invoice with the date, your name, the client's name, what the payment covers and the amount.",
   "Do not hand over final files for a large job without payment or a clear arrangement. Be cautious of anyone who asks you to pay money first, who sends a payment larger than the agreed amount and asks for a refund of the difference, or who pressures you to move to an unknown platform. These are common warning signs of scams. If something feels wrong, pause and check.",
   "Rules about taxes and business registration differ by country. Look up the rules where you live, and consider asking a qualified local professional if your income grows."]},
 {h:"Staying professional and building long-term trust",
  p:["Reliability is your biggest advantage. Reply within a day. Meet deadlines, or warn early if you will be late. Keep your promises small and your delivery steady. Clients who trust you will recommend you.",
   "Ask satisfied clients for a short testimonial and permission to show your work in your portfolio. Keep working on your skills. As you gain experience you can offer more, such as managing a creator's whole short-form schedule or writing hooks, but only after you are consistently good at the basics."]}
 ],
 mistakes:["Sending the same generic message to hundreds of people.","Starting work with no agreement on price, scope or deadline.","Skipping the deposit because the client seems friendly.","Dropping your price immediately when someone pushes back.","Promising views, followers or income to a client.","Not tracking who you contacted and when to follow up.","Using footage you do not have permission to use in your portfolio."],
 gloss:[["Portfolio","A small set of your best work shown as proof of skill."],["Pipeline","Your list of creators and where each one is in the conversation."],["Scope","The exact work, quantity, deadline and revisions agreed."],["Deposit","Part of the payment made before work starts."],["Revision","A change to finished work to match what was agreed."],["Package","A bundle of work sold together at one price."],["Testimonial","A short statement from a happy client about working with you."],["Invoice","A document requesting payment for work done."]],
 assign:["Build a 3-clip portfolio folder with a link that opens on a phone. Test it on another device.","Make a list of 20 creators in a sheet with the columns described in this lesson.","Pick 3 creators and watch one long video from each. Write down 2 specific moments with timestamps for each.","Write 3 first messages, one for WhatsApp, one for Instagram and one for email, each mentioning a real moment.","Write a package offer with one unit of work, what is included, the delivery time and your payment terms, ready to paste into a chat."],
 quiz:[
 {q:"What makes a first message more likely to get a reply?",o:["It is very long and detailed","It mentions a specific moment from the creator's content","It lists every service you offer"],a:1,why:"Specific details prove you paid attention and make the message feel personal."},
 {q:"What should be agreed before you start paid work?",o:["Nothing, to stay flexible","Number of clips, deadline, revisions, price and payment terms","Only the price"],a:1,why:"Clear scope prevents disagreements later. A deposit shows both sides are serious."},
 {q:"A client says your price is too high. What is a good first response?",o:["Cut the price in half immediately","Ask about their budget and offer a smaller scope","Stop replying"],a:1,why:"Adjusting scope keeps your rate and still gives the client a way to say yes."},
 {q:"How many follow-up messages are reasonable?",o:["One to two polite ones, then move on","Ten, daily","None ever"],a:0,why:"A couple of polite reminders are professional. After that, respect their silence."},
 {q:"Which is a warning sign of a payment scam?",o:["A client who pays the agreed deposit by bank transfer","A client who overpays and asks you to refund the difference","A client who asks for an invoice"],a:1,why:"Overpayment with a refund request is a common scam pattern. Verify and pause."}
 ]},

{id:"m4",title:"Copyright and platform rules",
 intro:"This lesson explains, in plain language, why copyright and platform rules matter for clippers, who owns what in gameplay content, how to get and record permission, and how to work in a way that lowers your risk. It is general education and not legal advice. Laws differ by country and situation, so when money or a serious dispute is involved, ask a qualified professional where you live.",
 sections:[
 {h:"Why this matters before anything else",
  p:["Clipping depends on other people's footage. That means you are working with content that someone else made and owns or controls. If you ignore the rules, the possible results include removed videos, muted audio, warnings or strikes on your account, lost accounts and, in serious cases, legal claims. Beginners often learn about these rules only after a problem. You can learn them now.",
   "Understanding the rules does not make you timid. It makes you reliable. Creators are more willing to work with someone who respects their content, and clients prefer a clipper who can explain where footage and music come from."]},
 {h:"Who owns what in a gameplay video",
  p:["A gameplay video is a layered thing, and different people may have rights in different layers. The game itself belongs to its developer or publisher, including its artwork, characters, music and sounds. The streamer or creator owns what they added, such as their voice, commentary, facecam and the way they edited the video. The music in the background may belong to a musician or label. Other players' voices may also be in the recording.",
   "This is why a single clip can involve several rights at once. Even if a creator says you can clip their stream, that permission usually covers only what they have the right to give. It does not automatically cover copyrighted songs playing in the background. Keep this layered view in mind whenever you pick footage."],
  ol:["The game: owned by the developer or publisher, usually with a published content policy.","The creator's contribution: voice, face, commentary and editing.","Music and sound: may belong to artists, labels or sound libraries.","Other people in the video: other players, guests or viewers.","Your contribution: your edit, hook, captions and structure."]},
 {h:"Permission: the strongest protection you can have",
  p:["The safest way to use someone's footage is to have clear permission from the creator, in writing. Writing can be a message on WhatsApp, an email or a short agreement. What matters is that it clearly says what you are allowed to do. Verbal permission is hard to prove.",
   "A good permission message says which videos or streams you may use, where you may post the clips, whether you may monetize them, whether you must credit the creator, and how long the permission lasts. If you do the work for the creator and they post the clips on their own accounts, the rules are different from when you post the clips on your own account, so be clear about which one you are doing."],
  ex:"You: Hi Tolu, before I start I want to make sure we are clear. May I clip your streams from this month and post the shorts on your TikTok and YouTube accounts?\nCreator: Yes, go ahead. Post them on my accounts. Tag me in the caption.\nYou: Perfect. I will save this message as our agreement. If anything changes, I will let you know.\n\nAfter this, take a screenshot with the date visible and save it in the same folder as the clips."},
 {h:"Game publisher content policies",
  p:["Many game publishers publish a content policy or fan content guidelines that explain what players and creators may do with videos of the game. Some allow gameplay videos and streams, including monetization, as long as certain conditions are met. Some restrict certain content, such as leaked material or misuse of logos. Policies can change, and they can differ between games and between regions.",
   "Find the official policy by searching the game's name plus words like content policy or fan content guidelines on the publisher's own website. Read it fully. Write down in your own words the rules that matter to you, such as monetization, use of music, and any required notices. Save the link and the date you read it."],
  l:["Search for the publisher's official page, not a third-party summary.","Read the whole policy, not just the headline.","Write the key rules in your own words.","Save the link and the date you checked.","Check again from time to time because policies can change."]},
 {h:"Platform rules for short videos",
  p:["Each platform has its own rules about reused content, music, spam and monetization. Many platforms prefer content that adds something original rather than simply re-uploading someone else's video unchanged. Your edit, your hook, your captions and your commentary can add value, but you must still follow the rules about the underlying footage.",
   "Read the community guidelines and the rules for monetization on every platform where you post. Pay attention to sections about reused or unoriginal content, copyrighted music and what happens after repeated violations. If you manage accounts for a creator, tell them about relevant rules so you both know what to expect."]},
 {h:"Music and sound effects",
  p:["Music causes many of the problems people run into. A song may be allowed in one place and not in another, and permission to use a song in a personal video may not cover use in a video that is monetized or used for business.",
   "The safer path is to use music and sound effects from libraries provided by the platform or editor for your type of account, or from sources that state clearly how you may use them. Keep notes on where each sound came from and what the terms say. If you are unsure, remove the song and use something you can confirm."]},
 {h:"Common myths that cause trouble",
  p:["Several myths sound convincing but can lead to problems. The first is that giving credit makes anything allowed. Credit is polite, but it does not replace permission. The second is that a clip under a certain number of seconds is always safe. No fixed length makes use automatically allowed. The third is that if others are posting it, it must be fine. Other people may simply not have been caught or may have permission you do not know about.",
   "Another myth is that fair use is a simple permission. Fair use is a legal idea in some countries, and it depends on the facts, such as the purpose, the amount used and the effect on the original. It is decided case by case. You should not build a business on guessing that something counts as fair use. When in doubt, get permission."],
  ul:["Credit does not replace permission.","There is no magic length that makes any clip safe.","Other people posting something is not proof it is allowed.","Fair use is not a simple permission and depends on the country and the facts.","If you are unsure, ask or choose different footage."]},
 {h:"What to do if you receive a claim or strike",
  p:["Even careful people may receive a notice. Stay calm. Read the notice fully to see what is being claimed and by whom. Check your records: do you have permission, a policy that allows your use, or a license for the music? If you believe the claim is a mistake and you have proof, you may be able to dispute it through the platform's process, but be honest, because false statements can make things worse.",
   "If the claim is correct, you may need to remove or edit the video. Learn from it by updating your checklist. If the situation is serious or involves a legal letter, stop and seek advice from a qualified professional. Do not ignore deadlines in a notice."]},
 {h:"Keeping records",
  p:["Records make all of the above easier. Keep a simple document or sheet for each project with the creator's name, the date of permission, a screenshot of the permission message, the link to the video, the game policy link and date you checked it, and the source of any music.",
   "Store this in the same cloud folder or drive as your clips. If anyone asks about a clip, you can answer in minutes with proof. This habit looks professional and protects both you and the creator."]},
 {h:"A safe workflow you can follow every time",
  p:["Turn everything above into a checklist you use before you start and before you post. It takes a few minutes and prevents most beginner problems. Over time it becomes automatic."],
  ol:["Whose footage is this? Do I have written permission?","What did they allow: which videos, which platforms, monetization, credit?","Does the game publisher's content policy allow this use? Link and date saved.","Is any music or sound in the video something I may use?","Do the platform rules allow this kind of content on my account?","Is everything saved in my project record?","If any answer is no or unsure, fix it or choose different footage."]}
 ],
 mistakes:["Starting a project with only a verbal OK.","Assuming that giving credit equals permission.","Leaving copyrighted music in the clip because it sounds good.","Believing a short length makes a clip automatically safe.","Not saving screenshots and links as proof.","Reading a summary of a policy instead of the publisher's own page.","Ignoring a platform notice and its deadline."],
 gloss:[["Copyright","The legal right of a creator or rights holder to control how their work is used."],["Permission","A clear OK from the subscriber, ideally written."],["Content policy","A publisher's rules on what players and creators may do with videos of a game."],["Monetization","Earning money from a video through ads, sponsorships or sales."],["Strike","A formal penalty on an account for breaking a platform rule."],["Claim","A notice that someone says a video uses their protected content."],["Fair use","A legal idea in some countries that depends on the facts. It is not an automatic permission."],["License","A defined permission to use something, often with terms."]],
 assign:["Find the official content policy for one game you like. Write 5 rules from it in your own words and save the link and today's date.","Write a permission message you could send to a creator. Include videos, platforms, monetization and credit.","Create a records sheet with the columns described in this lesson and fill it in for one imaginary project.","Find where a free music or sound library for your editor explains its terms. Write down 3 rules from it.","Write your own 7-step checklist from this lesson in a form you can keep next to your editor."],
 quiz:[
 {q:"What is the safest source of footage?",o:["Any popular video","Your own, or footage with clear written permission","A random reupload"],a:1,why:"Permission you can prove protects you if anyone questions the clip."},
 {q:"Does giving credit replace permission?",o:["Yes, always","No, credit is polite but not permission","Only on weekends"],a:1,why:"Credit does not give you rights. You still need permission or a policy that allows the use."},
 {q:"Why keep screenshots and dates of permission?",o:["It looks decorative","It lets you prove what was agreed if a question comes up","Platforms require screenshots for every post"],a:1,why:"Records let you answer quickly with proof and make you look professional."},
 {q:"Is there a clip length that is automatically safe?",o:["Yes, under 10 seconds","No, there is no magic length","Yes, under 30 seconds"],a:1,why:"The length of a clip does not by itself make the use allowed."},
 {q:"You get a claim on a clip and you have written permission. What should you do?",o:["Ignore it","Read it carefully and, if appropriate, use the platform's dispute process with your proof","Delete your account"],a:1,why:"Check the details, gather your proof and respond honestly within the stated time."}
 ]},

{id:"m5",title:"Digital products and courses",
 intro:"A digital product is something you make once and can sell many times, such as a checklist, a template pack, an ebook or a short course. In this lesson you will learn how to choose a problem, test demand, build a small first version with free tools, price it honestly, sell it and then grow it into a course. As always, nothing here guarantees sales. It is a careful method for testing an idea at low cost.",
 sections:[
 {h:"What a digital product is",
  p:["A digital product is a file or online resource that a buyer receives digitally. Common formats include a PDF checklist, a spreadsheet template, a pack of caption templates, an ebook, a set of video lessons or a full course. There is no shipping, and you can deliver the same product to many people.",
   "The value of a product is not in the file. It is in the problem it solves. A 10-page PDF that saves someone a week of confusion can be more valuable than a 200-page book that does not help them do anything. Think about the result the buyer wants and design the product to get them there as directly as possible."]},
 {h:"Choosing a problem you can solve",
  p:["Start with problems you have already solved or are in the middle of solving. Think about what people ask you. Think about what confused you when you started. If you are learning to clip GTA-style gameplay, the problems you recently overcame are fresh in your mind, and that is useful, because experts often forget what beginners struggle with.",
   "Narrow the problem. Not clipping, but how to cut your first 30-second GTA clip in CapCut. Not marketing, but how to write a first message to a streamer. The narrower the problem, the easier it is to describe, build and sell. You can always make more products later."],
  ul:["What did I recently learn that others struggle with?","What questions do beginners ask repeatedly?","What task takes people a long time that I can make faster with a template?","Can I describe the result in one sentence?"],
  ex:"Narrow problem: how to write the first message to a streamer so it gets a reply. Product: a 12-page PDF called First Message Toolkit with 10 templates, 5 real examples and a tracking sheet."},
 {h:"Testing demand before you build",
  p:["Building a product that nobody wants is the most common waste of time. Test interest first. Post about the problem and see who responds. Ask 5 to 10 people in your network or community whether they have this problem and what they have tried. Offer a free mini version and see whether people use it and ask for more.",
   "A stronger test is a pre-sale: describe what you will make, set a modest price and ask whether anyone would like to buy it when it is ready. If nobody is interested, you have saved weeks. If a few people say yes, you have both feedback and motivation. Be honest about what is finished and what is coming, and never take money for something you cannot deliver."]},
 {h:"Choosing the format",
  p:["Pick the simplest format that solves the problem. A checklist works for repeatable steps. A template works for things people fill in, such as a message or a spreadsheet. An ebook works when explanation matters. A mini course works when people need to see you do something. A community or coaching works later, when you have experience and time.",
   "For a first product, a small PDF or template is almost always the best choice. It is quick to make, easy to deliver and easy to improve. A full video course takes much more effort, and it is better to start there only after a smaller product has shown that people care."],
  l:["Checklist: for steps that repeat.","Template pack: for messages, scripts and sheets.","Ebook: for explanations and examples.","Mini course: for skills that need demonstration.","Community or coaching: later, with experience."]},
 {h:"Building the first version with free tools",
  p:["Write an outline first. List the sections, the order and what the reader will be able to do after each one. Then write short sections in plain language. Use real examples. A reader should be able to follow your steps without guessing.",
   "For design, free tools like Canva or Google Docs are enough. Use a clean layout with readable fonts, plenty of white space, simple headings and consistent colors. Add one or two screenshots if they make a step clearer. Export as PDF and open it on a phone and a computer to check it.",
   "Ask 2 or 3 people to try the product and tell you where they got stuck. Fix those places. A small product that works is better than a large product that confuses."]},
 {h:"Pricing honestly",
  p:["Pricing a product is part research and part testing. Look at similar products and see how they are priced. Consider the value of the result, the length and quality of the product and what your audience can afford. A low starting price can help early buyers say yes, and you can raise it as you improve the product and gather proof.",
   "Offer clear options if useful, such as a basic version and a version with extra templates. Avoid fake discounts and fake countdowns. If you offer a limited-time price, make sure it is true. Trust is worth far more than a short-term sale.",
   "Have a clear refund policy. Even a simple statement shows professionalism. Check the rules of the store you use, and the consumer rules in your country, so that you follow them."]},
 {h:"Where to sell and how delivery works",
  p:["Free-to-start online stores let you upload a file, set a price, collect payment and deliver the download automatically. Compare a few options and check their fees, payout methods and whether they support your country. Choose one that is simple and that pays out in a way you can use.",
   "After setting up, test the whole buyer journey yourself: view the page, go through checkout if there is a test mode, and confirm the download works. Many problems appear only when you test the full path. Make sure the page loads well on a phone."]},
 {h:"Writing the sales page",
  p:["A sales page does not need to be fancy. It needs to answer a few questions clearly. What is this? Who is it for? What will I be able to do after using it? What is included? What does it cost? How do I get it? Add a short section for common questions, such as format, delivery and refunds.",
   "Write in plain language. Lead with the result, not with a description of the file. Include real examples or a small preview so people can see the quality. If you have testimonials from real users, include them with permission, and never invent them."],
  ol:["Headline: the result the buyer wants.","Who it is for and who it is not for.","What is inside, in a short list.","A preview or sample page.","Price and how delivery works.","Short answers to common questions.","One clear button to buy."]},
 {h:"A small launch plan",
  p:["A launch can be small and calm. Tell your community what you made and why, show a preview, share one real example of how it helps and give the link. Do this over several days instead of once. Answer every question you receive, because questions show you what buyers want to know and help you improve the page.",
   "After the first buyers, ask for feedback. What did they like? What was missing? What would make it better? Use their answers to create version two. A product improves most through real use."]},
 {h:"From product to course",
  p:["When a smaller product has proven that people want your help, you can build a course. Start from the result: after this course the student can do X. Then list the modules that move from zero to X in a sensible order. Each module has a few short lessons. Each lesson has a clear goal, an explanation, an example, a small task and a check question.",
   "Keep lessons short, about 5 to 12 minutes of video or a few pages of text. Record the first lesson only, and ask a few people to try it before you build the rest. Teach one focused idea at a time and only move forward when the learner has shown they understood. This is how this platform's lessons are built too.",
   "Support matters. Decide how students can ask questions, how fast you will answer and what happens if someone is unhappy. A course with clear support feels trustworthy."],
  ex:"Mini course outline: Result: cut and post a 30-second GTA-style clip. Module 1: choose moments. Module 2: cut and trim. Module 3: hooks and captions. Module 4: export and post. Module 5: review your results. Each module ends with a task and a 3-question check."}
 ],
 mistakes:["Building for months before asking anyone whether they want it.","Choosing a problem so wide that the product tries to teach everything.","Making the first product too large to finish.","Using fake testimonials, fake discounts or fake countdowns.","Never testing the checkout and download yourself.","Taking money for features that do not exist yet.","Ignoring buyer feedback after the first sales."],
 gloss:[["Digital product","A downloadable or online product that can be delivered many times."],["Pre-sale","Selling before the product is finished, with honest information about what is coming."],["Template","A ready-made structure that people fill in with their own details."],["Sales page","A page that explains the product and lets people buy."],["Refund policy","Your stated rule for when buyers can get their money back."],["Module","A group of related lessons inside a course."],["Outcome","The result a buyer or student wants to achieve."],["Version two","An improved version built from real feedback."]],
 assign:["Write a list of 10 problems you recently solved or are solving. Choose 3 and narrow each to one specific sentence.","Ask 5 people whether they have your chosen problem and what they tried. Write down their answers.","Outline a small product with sections, examples and the result for each section.","Draft a sales page using the 7 parts in this lesson, with real wording.","Write the outline of a 5-module mini course with a task and a check question for each module."],
 quiz:[
 {q:"What should the first version of a product be?",o:["As large as possible","The smallest useful version","A full video course"],a:1,why:"A small version gets feedback fast and costs little to fix."},
 {q:"What is the best way to reduce the risk of building something nobody wants?",o:["Build it quietly for months","Test interest and ask real people first","Copy the biggest competitor"],a:1,why:"Testing demand early saves time and shows what people actually need."},
 {q:"Which is an honest way to use a limited-time price?",o:["Show a countdown that resets every day","Offer a time-limited price that truly ends","Never mention price"],a:1,why:"Fake urgency damages trust. If you use limited time, make it real."},
 {q:"What should a sales page lead with?",o:["A long history of your life","The result the buyer wants","A list of technical file details"],a:1,why:"Buyers care first about what they will be able to do after using the product."},
 {q:"What do you do after the first buyers use the product?",o:["Ignore feedback","Ask for feedback and use it to improve a second version","Stop selling"],a:1,why:"Real use shows you what to fix and what to add."}
 ]},

{id:"m6",title:"Sales, messages and confidence",
 intro:"Selling is helping a person decide. This lesson covers the basics of marketing psychology used honestly, storytelling, writing offers and sales copy, professional messages on WhatsApp, Instagram and email, active listening, handling objections, negotiation and building real confidence. You will see realistic conversation examples throughout. You can practice them out loud, with a friend or with the AI section in role-play mode.",
 sections:[
 {h:"Selling as helping someone decide",
  p:["Many beginners dislike selling because they imagine pressure and tricks. Good selling is the opposite. It is understanding what someone wants, explaining honestly how you can help and letting them decide freely. If your offer is not right for them, the best sale is the one you do not make.",
   "This mindset lowers your stress. You are not trying to win. You are trying to find out whether there is a fit. Sometimes the answer is yes, sometimes no, and sometimes later. All of these are acceptable results, and each one teaches you something."]},
 {h:"Marketing psychology, used honestly",
  p:["People are not purely logical, and understanding common patterns helps you communicate clearly. You should use these ideas to make a good offer easier to understand, never to deceive.",
   "Attention comes first. People scroll fast, so your first line must be clear and relevant. Trust comes next. People buy from those they believe will deliver. Proof builds trust: real examples, real results, real testimonials with permission. Clarity matters, because confused people do not decide. Social proof means people feel safer when others like them have used something, but it must be real. Loss aversion means people dislike losing more than they like gaining, so describing a real cost of staying stuck can motivate, as long as you are truthful and not fear-mongering. Anchoring means the first number a person sees influences how they judge other numbers, so showing a larger package first can make a middle option feel reasonable.",
   "Honesty is the long-term strategy. A tactic that works once but damages trust makes your next sale harder. Aim to be someone people are glad they dealt with."],
  l:["Attention: a clear, relevant first line.","Trust: proof, consistency and honesty.","Clarity: one idea, one next step.","Social proof: real testimonials, with permission.","Loss aversion: name a real cost, without scaring.","Anchoring: show options so the middle makes sense."]},
 {h:"Storytelling that serves the sale",
  p:["Stories help people remember and feel. A useful sales story has a person, a problem, a turning point and a result. It does not need to be dramatic. It needs to be true and relevant to the person you are talking to.",
   "A simple structure is: where I was, what I tried, what changed, what happened. For example: I used to spend four hours cutting one clip and nobody watched it. I changed how I chose moments and wrote a hook in the first two seconds. My next clips took one hour, and viewers watched longer. Keep stories short and connect them to the offer."],
  ex:"Short story for a message: Last month I helped a small streamer turn one 2-hour stream into 8 short clips. He had never posted shorts before. His first week, his shorts got more views than his last 10 long videos, and he asked me to keep going. (Only say this if it is true. If you do not have such a story yet, use a story about your own learning.)"},
 {h:"Writing a clear offer",
  p:["An offer is a plain statement of what you provide, for whom, what result they can expect, what it costs and what to do next. A clear offer reduces back-and-forth and makes saying yes easy. A weak offer is vague, such as: I can edit videos. A clear offer is specific.",
   "Be careful with promises. You can promise your own actions, like delivery time and number of clips. You should not promise outcomes you cannot control, such as views, followers or income."],
  ol:["Who it is for.","What you do, in one sentence.","What is included.","Delivery time.","Price and payment terms.","What the next step is."],
  ex:"Offer: I turn long gaming streams into short vertical clips for streamers who want to post on TikTok, Reels and Shorts. For [price], you get 10 clips of up to 45 seconds with hooks and captions, delivered within 5 days after you send the videos, with one round of changes. To start, reply with the stream link and I will send the details and a deposit link."},
 {h:"Sales copy formulas you can use",
  p:["Copy means the words you write to inform and persuade. Two simple formulas work well for beginners. The first is Problem, Agitate, Solution. State the problem clearly, describe honestly what it costs the person to keep it, then present your solution. The second is Before, After, Bridge. Describe the current situation, describe the situation they want, then explain how your offer is the bridge between them.",
   "Whichever you use, keep sentences short, avoid jargon and use the words your audience uses. Read your copy out loud. If it sounds unnatural, rewrite it. Replace big claims with specific facts."],
  ex:"Problem, Agitate, Solution: You record long streams but never post shorts. Every week, great moments disappear into hours of video, and new viewers never see them. I find the best moments and turn them into ready-to-post shorts, so you can focus on streaming.\n\nBefore, After, Bridge: Before: your best moments are buried in 3-hour streams. After: you have a steady set of short clips ready to post each week. Bridge: send me your streams and I will clip, caption and deliver them."},
 {h:"Professional messages on WhatsApp, Instagram and email",
  p:["Professional does not mean stiff. It means clear, respectful and reliable. Greet the person by name, get to the point, use short paragraphs and end with a clear next step. Reply at reasonable hours and within a day when possible. If you will take longer, say so.",
   "Match the channel. WhatsApp and Instagram are quick and informal, so use short sentences and a friendly tone. Email can be more structured, with a subject line that tells the person what the message is about. Avoid all caps, too many emojis and long voice notes unless the other person prefers them. Always read your message once before sending."],
  ex:"WhatsApp, delivering work: Hi Ada, the 10 clips are ready. Here is the folder link: [link]. Please check them and send any changes by Friday. Thank you!\n\nInstagram, asking for feedback: Hi Tunde, thanks again for working with me. Could you share one sentence on how it went? It would help me a lot, and I will only use it with your permission.\n\nEmail, sending an invoice: Subject: Invoice for 10 short clips. Hello Tolu, attached is the invoice for the 10 clips delivered on [date]. Payment details are in the document. Please let me know if you have questions. Thank you."},
 {h:"Active listening",
  p:["Active listening means giving the other person your full attention and showing that you understood. It is one of the strongest skills in sales and in everyday life. When someone explains their needs, do not think about your next line. Let them finish. Then reflect back what you heard and ask a follow-up question.",
   "Reflecting sounds like: So you want ten clips a week and you are worried about quality, is that right? This lets the person confirm or correct you, and it makes them feel heard. Good questions are open and simple: What would a great result look like for you? What have you tried so far? What matters most this month?",
   "In text chats, listening shows up as careful reading. Reread their message before replying and answer their actual questions. Missing a question and sending a generic reply is the fastest way to lose trust."],
  ex:"Creator: I need clips fast but I do not want them to look cheap.\nYou: Got it. So speed and quality both matter. When you say cheap, what have you seen that you did not like?\nCreator: Tiny captions and too many sound effects.\nYou: Thanks, that helps. I will use large clear captions and keep the effects light. Would you like to see a sample in that style before we start?"},
 {h:"Handling objections",
  p:["An objection is a concern a person raises before deciding. Objections are normal and often mean the person is thinking seriously. Do not argue. Listen, ask what is behind it and respond honestly. The three most common objections are price, timing and trust.",
   "For price, find out whether it is about the total amount, the budget or the value. You can adjust the scope, offer a smaller package or explain what is included. Do not instantly cut your price. For timing, ask what would make it a better time and offer to follow up later. For trust, offer samples, a small trial job or references from real clients, if you have them."],
  ex:"Price: Client: That is too expensive. You: Understood. What budget did you have in mind? For that budget I can do 5 clips instead of 10. Would that work?\n\nTiming: Client: Maybe next month. You: No problem. Would it help if I send a quick reminder on the 1st? Meanwhile, I can send a free sample so you know what to expect.\n\nTrust: Client: I do not know you yet. You: Fair enough. How about a small trial of 2 clips first? You can see the quality before deciding on more."},
 {h:"Negotiation basics",
  p:["Negotiation is finding terms that work for both sides. Prepare by deciding three things before the conversation: the ideal result, the minimum you will accept and what you can offer instead of lowering your price, such as a smaller scope, a longer delivery time or a longer commitment.",
   "During the conversation, stay calm and friendly. Ask questions to understand their position. State your proposal clearly and then pause. Silence can feel uncomfortable, but it gives the other person time to think. If you cannot agree, you may politely decline. Being willing to walk away is part of negotiating well.",
   "Put the final agreement in writing and confirm each point. Misunderstandings often come from unwritten assumptions."]},
 {h:"Building real confidence",
  p:["Confidence is not a personality trait you either have or lack. It grows from preparation and repetition. Before an important message or call, write your first sentence, list your main points and prepare answers to two or three likely questions. Practice out loud at least three times.",
   "In live conversations, slow down. Breathe, speak a little slower than feels natural and pause between ideas. Nervousness is normal and usually less visible to others than it feels to you. Focus on the other person, not on yourself. If you make a mistake, correct it simply and continue.",
   "Treat every conversation as practice. After each one, write down what went well and one thing to improve. Over weeks, your confidence will rise because it is built on evidence of your own progress."],
  ul:["Prepare your first sentence.","Practice out loud, not only in your head.","Speak slowly and pause.","Focus on the other person.","Review each conversation and note one improvement."]},
 {h:"Setting boundaries and saying no",
  p:["Professional relationships need boundaries. You can say no to work you cannot do well, to unrealistic deadlines, to requests outside the agreed scope and to anything that feels unethical. Saying no politely protects your reputation.",
   "A good no is short, kind and offers an alternative when possible. For example: I cannot deliver 20 clips by tomorrow. I can deliver 5 by tomorrow and the rest by Friday. Would that work? Clear boundaries make clients trust you more, not less."]}
 ],
 mistakes:["Sending long messages with no clear next step.","Arguing with an objection instead of asking about it.","Promising results you cannot control.","Dropping your price the moment someone hesitates.","Inventing stories or testimonials.","Answering a different question than the one asked.","Skipping preparation and then feeling nervous."],
 gloss:[["Offer","A clear statement of what you provide, for whom, for what price and with what next step."],["Objection","A concern raised before someone decides."],["Anchoring","When the first number seen influences how other numbers are judged."],["Social proof","Evidence that others have used and liked something."],["Copy","Written words meant to inform and persuade."],["Active listening","Giving full attention and showing you understood."],["Scope","The exact work and limits of what you agreed to do."],["Boundary","A limit you set on what you will do or accept."]],
 assign:["Write your own offer using the 6 parts in this lesson.","Write one Problem, Agitate, Solution paragraph and one Before, After, Bridge paragraph for the same offer.","Write 3 WhatsApp messages: one first contact, one delivery message and one request for feedback.","Role-play a price objection with a friend or with the AI section in role-play mode and write what you would change.","Write your three negotiation numbers for one service: ideal, minimum and what you could offer instead of a lower price."],
 quiz:[
 {q:"A client says your price is too high. What is a good first move?",o:["Drop the price at once","Ask about their budget and adjust the scope","Stop replying"],a:1,why:"Adjusting scope keeps your rate and gives the client a way to say yes."},
 {q:"What does active listening include?",o:["Waiting for your turn to talk","Letting them finish, reflecting back what you heard and asking a follow-up","Interrupting with your offer"],a:1,why:"Reflecting shows you understood and invites correction."},
 {q:"Which promise is safe to make in an offer?",o:["You will get 100,000 views","Delivery within 5 days after receiving the videos","You will earn money"],a:1,why:"You can promise your own actions. You cannot control views or income."},
 {q:"What is the honest way to use social proof?",o:["Invent testimonials","Share real feedback with permission","Never mention results"],a:1,why:"Real proof builds trust. Fake proof destroys it."},
 {q:"What builds confidence most reliably?",o:["Hoping for the best","Preparation, practice and reviewing each conversation","Memorizing a long script word for word"],a:1,why:"Confidence grows from preparation and evidence of your own progress."}
 ]},

{id:"m7",title:"How subscriptions and course access work",
 intro:"Understand what a guest preview includes, what an active subscription unlocks and how to use a learning platform responsibly.",
 sections:[
 {h:"Guest preview and paid access",p:["A guest can explore the academy, read the course overview, view the plan options and open the lessons marked as free preview. The preview helps you decide whether the course is useful before subscribing.","An active subscriber can open all published lessons, complete assignments, track progress and use the included AI learning assistant. Access remains available while the subscription is active, subject to the published plan terms."]},
 {h:"What a subscription includes",p:["A subscription is paid access for a defined period, such as one month or one year. In this academy, every plan includes the same learning features: all 12 lessons, practical assignments, knowledge checks, progress tracking and the AI assistant. The billing period and price are the only differences between plans.","Before choosing a plan, check its price, renewal period, cancellation process and any refund terms. Do not subscribe unless you understand what will be charged and when."]},
